name: Build clean provider-control completion branch

on:
  push:
    branches:
      - chatgpt/provider-control-runtime-v2-20260902

permissions:
  contents: write

concurrency:
  group: build-clean-provider-control-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact current-main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/provider-control-runtime-v2-20260902
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply net provider-control production diff
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "454d7d659cbb95e5e21443c5d6bb7794ddfe2880"
          git diff --binary \
            5d830ab1c3629447a873b45dca19a043adea78e0 \
            abbae5a7075ae4a260da562eb7136f6171703a25 \
            -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude)config/test-skip-register.v1.json' \
            > "$RUNNER_TEMP/provider-control.patch"
          test -s "$RUNNER_TEMP/provider-control.patch"
          git apply --3way --index "$RUNNER_TEMP/provider-control.patch"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Reconcile current identity and umbrella-safety authorities
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"{label} drifted")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          roots = [Path("config/runtime.env.example")]
          roots.extend(sorted(Path("config").glob("**/*.env.example")))
          for path in dict.fromkeys(roots):
              if not path.is_file():
                  continue
              seen: dict[str, str] = {}
              output: list[str] = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or "=" not in line:
                      output.append(line)
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  if key in seen:
                      if seen[key] != value:
                          raise SystemExit(
                              f"conflicting duplicate environment key {key} in {path}"
                          )
                      continue
                  seen[key] = value
                  output.append(line)
              path.write_text("\n".join(output) + "\n", encoding="utf-8")

          replace_once(
              Path("app/config.py"),
              "        enabled = {\n            name for name, value in self.external_effects.items() if value\n        }\n",
              "        enabled = {\n            name\n            for name, value in self.external_effects.items()\n            if value and name not in UMBRELLA_CONTROL_NAMES\n        }\n",
              "external-effect validation block",
          )

          replace_once(
              Path("app/provider_control_api.py"),
              "    subject = claims.get(\"sub\")\n    if not isinstance(subject, str) or not subject.strip():\n        raise AuthorizationError(\"machine token subject is required\")\n\n    command = CommandEnvelope(\n",
              "    subject = claims.get(\"sub\")\n    if not isinstance(subject, str) or not subject.strip():\n        raise AuthorizationError(\"machine token subject is required\")\n    authenticated_client_id = claims.get(\"azp\")\n    if (\n        not isinstance(authenticated_client_id, str)\n        or authenticated_client_id != spec.caller_client_id\n    ):\n        raise AuthorizationError(\"verified machine client identity is required\")\n\n    command = CommandEnvelope(\n",
              "provider-control subject block",
          )
          replace_once(
              Path("app/provider_control_api.py"),
              "    operation = await active.commands.submit(\n        command,\n        authenticated_subject=subject,\n    )\n",
              "    operation = await active.commands.submit(\n        command,\n        authenticated_subject=subject,\n        authenticated_client_id=authenticated_client_id,\n    )\n",
              "provider-control submit block",
          )
          replace_once(
              Path("tests/test_operations.py"),
              "    asyncio.run(store.submit(command))\n",
              "    asyncio.run(\n        store.submit(\n            command,\n            authenticated_client_id=\"n8n-automation\",\n        )\n    )\n",
              "retry test submit block",
          )
          replace_once(
              Path("tests/test_provider_control_api.py"),
              "            assert stored.requested_by == spec.caller_client_id\n\n            replay = client.post(spec.route, headers=headers, json=body)\n",
              "            assert stored.requested_by == spec.caller_client_id\n            events = asyncio.run(\n                runtime.commands.list_events(  # type: ignore[union-attr]\n                    \"tenant-1\",\n                    operation_id,\n                    limit=10,\n                )\n            )\n            assert (\n                events[0].safe_metadata[\"authenticated_client_id\"]\n                == spec.caller_client_id\n            )\n\n            replay = client.post(spec.route, headers=headers, json=body)\n",
              "provider-control provenance assertion",
          )
          PY
          rm -f .github/workflows/build-clean-provider-control-pr.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Install exact locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m venv .venv-clean-pr
          .venv-clean-pr/bin/python -m pip install --disable-pip-version-check --no-input --quiet --upgrade pip
          .venv-clean-pr/bin/python -m pip install --disable-pip-version-check --no-input --quiet --require-hashes -r requirements-test.txt

      - name: Regenerate exact source contracts
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. .venv-clean-pr/bin/python scripts/generate_api_contracts.py
          git add contracts/platform/integration-fabric-api.v2.yaml \
                  contracts/platform/middleware-openapi.generated.json \
                  config/api-completion-matrix.yaml
          git diff --cached --check

      - name: Run focused merged-authority regressions
        run: |
          set -Eeuo pipefail
          .venv-clean-pr/bin/python scripts/validate_staging_intake_observability_contract.py
          .venv-clean-pr/bin/python -m pytest -q \
            tests/test_odoo_transport.py \
            tests/test_security.py \
            tests/test_runtime.py \
            tests/test_operations.py \
            tests/test_temporal_transport.py \
            tests/test_provider_control_api.py \
            tests/test_authority_compatibility.py

      - name: Run complete locked source certification
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          git diff --check
          git diff --cached --check

      - name: Commit and push clean current-main source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "ChatGPT repository remediation"
          git config user.email "noreply@openai.com"
          git commit -m "feat: complete provider control runtime on current main"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/chatgpt/provider-control-runtime-v2-20260902"
