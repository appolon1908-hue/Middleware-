name: Migration repair source snapshot
on:
  push:
    branches: [fix/runtime-migration-certification-20260907]
    paths: [.github/workflows/migration-repair-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/middleware-source.tar.gz"
          sha256sum "$RUNNER_TEMP/middleware-source.tar.gz" > "$RUNNER_TEMP/middleware-source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: middleware-migration-repair-source
          path: |
            ${{ runner.temp }}/middleware-source.tar.gz
            ${{ runner.temp }}/middleware-source.sha256
          retention-days: 1
          if-no-files-found: error
