name: Resolve SMS branch against current main

on:
  push:
    branches:
      - feat/communications-api-v1-sms-runtime

permissions:
  contents: write

concurrency:
  group: sms-current-main-resolution
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out SMS branch
        uses: actions/checkout@v5
        with:
          ref: feat/communications-api-v1-sms-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch current main
        run: git fetch origin main

      - name: Merge and resolve the exact known conflict set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -eq 0 ]; then
            echo "current main merged without conflicts"
          else
            git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts.txt
            cat > /tmp/expected-conflicts.txt <<'EOF'
          app/communications.py
          app/main.py
          scripts/temporal_integration_ci.sh
          tests/integration/test_temporal_workflows.py
          tests/test_communications_email.py
          EOF
            sort -o /tmp/expected-conflicts.txt /tmp/expected-conflicts.txt
            diff -u /tmp/expected-conflicts.txt /tmp/actual-conflicts.txt

            git checkout --ours -- \
              app/communications.py \
              app/main.py \
              scripts/temporal_integration_ci.sh
            git checkout --theirs -- \
              tests/integration/test_temporal_workflows.py \
              tests/test_communications_email.py

            python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_temporal_workflows.py")
          text = path.read_text(encoding="utf-8")
          marker = '''            assert activities.execute_attempts == provider_execution_attempts
                      assert activities.readback_attempts == readback_attempts_before
          '''
          addition = marker + '''

                      activities.command_transitions.clear()
                      execute_attempts_before = activities.execute_attempts
                      readback_attempts_before = activities.readback_attempts
                      uncertain_sms = await environment.client.execute_workflow(
                          CommandExecutionWorkflow.run,
                          CommandExecutionRequest(
                              command_id="00000000-0000-4000-8000-000000000003",
                              command_type="sms.message.submit.v1",
                              command_version="1.0",
                              target="telnexa-sms",
                              tenant_id="tenant-test",
                              requested_by="user-1",
                              correlation_id="sms-correlation-1",
                              idempotency_key="sms-idempotency-1",
                              capability="SMS_DELIVERY",
                              payload={"message_id": "message-2"},
                          ),
                          id="test-sms-command-unknown-outcome",
                          task_queue=TASK_QUEUE,
                      )
                      assert uncertain_sms.status == "reconciliation_required"
                      assert activities.command_transitions == [
                          "queued",
                          "dispatching",
                          "reconciliation_required",
                      ]
                      assert activities.execute_attempts == execute_attempts_before + 1
                      assert activities.readback_attempts == readback_attempts_before
          '''
          if text.count(marker) != 1:
              raise SystemExit("email reconciliation insertion marker was not unique")
          path.write_text(text.replace(marker, addition), encoding="utf-8")
          PY
          fi

          git add -A
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.md'; then
            echo "unresolved merge markers remain" >&2
            exit 1
          fi
          git diff --cached --check
          python -m compileall -q app tests

      - name: Commit resolved merge and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sms-main-merge-resolve.yml
          git add -A
          git commit -m "merge(sms): reconcile current main into Step 4 runtime"
          git push origin HEAD:feat/communications-api-v1-sms-runtime
