name: Publish already verified Middleware repair objects
on:
  push:
    branches: [fix/middleware-issues-audit-20260907]
    paths: [.github/workflows/middleware-verified-repair-publication.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Repository source is handled only as data: no scripts, imports or hooks run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d93f1c83141580a984a91c7736fb448ca9195f17
          fetch-depth: 1
          persist-credentials: false
      - name: Recover only the previously verified tree and store source objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = d93f1c83141580a984a91c7736fb448ca9195f17
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request, zlib
          from pathlib import Path
          parent = 'd93f1c83141580a984a91c7736fb448ca9195f17'
          expected = 'deae895545ff1309193480133a5f452649722318'
          prefix = 'https://api.github.com/repos/appolon1908-hue/Middleware-/'
          def api(path, payload=None):
              request = urllib.request.Request(prefix + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = api('actions/runs/34119350321')
          job = api('actions/jobs/101733544470')
          if run['head_sha'] != 'ec3b470d9660e5f864049a3816b650d78b336b28' or job['run_id'] != run['id'] or job['name'] != 'verify' or job['status'] != 'completed' or job['conclusion'] != 'success':
              raise SystemExit('previous successful verification not established')
          steps = {step['name']: step['conclusion'] for step in job['steps']}
          for name in ['Reconstruct hash-verified source-only patch', 'Validate all repaired and previously failing type targets', 'Execute repaired isolated required-CI gates', 'Validate repository governance and manifest source gates', 'Package only exact verified source replacements']:
              if steps.get(name) != 'success':
                  raise SystemExit('missing successful verification step')
          def blob(sha):
              row = api('git/blobs/' + sha)
              data = base64.b64decode(row['content'])
              if row['sha'] != sha or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != sha:
                  raise SystemExit('blob hash mismatch')
              return data
          parts = ['b04ea7c66c2ecdc0c37163774d6fdefc9c11b3e7', 'dfc162eaee12d801c438ce8a5fb9ddf8fcf47c2d', '0f154f1b5a17ab77cb70bb5845e57e7b8a1b2b10', 'd53a39fd3cafaf07c3fef7f4e3c79815e7a31519']
          compressed = b''.join(blob(sha) for sha in parts)
          if hashlib.sha256(compressed).hexdigest() != '8fd79200bdd3a8a6fed5411f512d151e1b95a13f565d7055fac4c026e0df5e5a':
              raise SystemExit('compressed repair mismatch')
          patch = lzma.decompress(compressed)
          if len(patch) != 107010 or hashlib.sha256(patch).hexdigest() != 'd3582d20a4cddef6a45108dd15d72c458318f0ea763a5a753016950ddce2d59c':
              raise SystemExit('repair mismatch')
          delta = zlib.decompress(blob('18dba2b5275a364ed8b6c927ba8929e249eb995d'))
          if hashlib.sha256(delta).hexdigest() != 'e100828a4e3f502c6ae772ab2f6433a6f6ead63fd8aa37d7049202d081272c6d':
              raise SystemExit('fixture delta mismatch')
          for data in (patch, delta):
              subprocess.run(['git', 'apply', '--check', '--index', '-'], input=data, check=True)
              subprocess.run(['git', 'apply', '--index', '-'], input=data, check=True)
          if subprocess.check_output(['git', 'write-tree'], text=True).strip() != expected:
              raise SystemExit('source differs from successfully tested tree')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if len(names) != 35:
              raise SystemExit('unexpected verified replacement count')
          rows = []
          for name in names:
              path = Path(name)
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(Path.cwd().resolve()):
                  raise SystemExit('invalid regular source path')
              data = path.read_bytes()
              mode, sha, stage, _ = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()
              if mode not in {'100644', '100755'} or stage != '0' or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != sha:
                  raise SystemExit('source object mismatch')
              result = api('git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              if result['sha'] != sha:
                  raise SystemExit('stored source object mismatch')
              rows.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': sha})
          target = Path(os.environ['RUNNER_TEMP']) / 'tree-elements.json'
          target.write_text(json.dumps({'parent': parent, 'tree_sha': expected, 'verified_run': run['id'], 'verified_job': job['id'], 'tree': rows}, indent=2) + '\n')
          print('VERIFIED_SOURCE_OBJECTS_STORED=35')
          print('REPOSITORY_REFS_CHANGED=NO')
          print('PRODUCTION_CHANGED=NO')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-issue-tree-${{ github.sha }}
          path: ${{ runner.temp }}/tree-elements.json
          if-no-files-found: error
          retention-days: 7
