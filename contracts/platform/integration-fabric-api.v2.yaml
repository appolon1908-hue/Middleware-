components:
  schemas:
    CommandEnvelope:
      properties:
        command_id:
          type: string
          format: uuid
          title: Command Id
        command_type:
          type: string
          maxLength: 180
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)+$
          title: Command Type
        command_version:
          type: string
          const: '1.0'
          title: Command Version
        target:
          type: string
          maxLength: 100
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Target
        tenant_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Tenant Id
        requested_by:
          type: string
          maxLength: 300
          minLength: 1
          title: Requested By
        correlation_id:
          type: string
          maxLength: 180
          minLength: 1
          title: Correlation Id
        idempotency_key:
          type: string
          maxLength: 180
          minLength: 8
          title: Idempotency Key
        capability:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,100}$
          title: Capability
        payload:
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
      - command_id
      - command_type
      - command_version
      - target
      - tenant_id
      - requested_by
      - correlation_id
      - idempotency_key
      - capability
      - payload
      title: CommandEnvelope
    ControlMutation:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.: -]*$'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - expected_version
      - reason
      title: ControlMutation
    CreateMessageRequest:
      properties:
        channel:
          type: string
          enum:
          - email
          - sms
          - voice
          title: Channel
        from:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 1
          - type: 'null'
          title: From
        to:
          items:
            type: string
          type: array
          maxItems: 1000
          minItems: 1
          title: To
        senderIdentityId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Senderidentityid
        domainId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Domainid
        content:
          $ref: '#/components/schemas/MessageContent'
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduledat
        metadata:
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - channel
      - to
      - content
      title: CreateMessageRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MessageContent:
      properties:
        subject:
          anyOf:
          - type: string
            maxLength: 998
          - type: 'null'
          title: Subject
        text:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Text
        html:
          anyOf:
          - type: string
            maxLength: 200000
          - type: 'null'
          title: Html
        templateId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Templateid
        templateVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Templateversion
        variables:
          anyOf:
          - type: object
          - type: 'null'
          title: Variables
        mediaUrls:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 20
          - type: 'null'
          title: Mediaurls
      additionalProperties: false
      type: object
      title: MessageContent
    OperationMutationRequest:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        reason:
          type: string
          maxLength: 500
          minLength: 1
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.: -]*$'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - expected_version
      - reason
      title: OperationMutationRequest
    PolicyDecisionRequest:
      properties:
        capability:
          type: string
          maxLength: 100
          minLength: 1
          title: Capability
        proposed_action:
          type: string
          maxLength: 180
          minLength: 1
          title: Proposed Action
      additionalProperties: false
      type: object
      required:
      - capability
      - proposed_action
      title: PolicyDecisionRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak machine token; issuer auth.codestra.co realm codestra;
        audience middleware-api
