name: PR159 disposable schema reference
on:
  push:
    branches: [diag/pr159-schema-contract-20260907]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: middleware_test_schema
          POSTGRES_USER: middleware_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U middleware_ci -d middleware_test_schema"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt
      - name: Generate reference only from empty disposable database
        env:
          DATABASE_URL: postgresql://middleware_ci:ci-only-password@127.0.0.1:5432/middleware_test_schema
          LIVE_WRITES_ENABLED: 'false'
          N8N_PRODUCTION_WORKFLOWS_ENABLED: 'false'
          VICIDIAL_WRITE_ENABLED: 'false'
          CALLBACK_DISPATCH_ENABLED: 'false'
          MESSAGING_ENABLED: 'false'
          OUTBOX_WORKER_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          for target in 65.109.65.169/32 65.21.67.207/32 37.27.128.39/32 10.40.0.0/24; do
            for chain in OUTPUT FORWARD; do
              sudo -n iptables -I "$chain" 1 -d "$target" -j REJECT
            done
          done
          python - <<'PY'
          import asyncio, json, os
          from pathlib import Path
          import asyncpg
          from scripts import migrate_runtime as runner
          from scripts.production_migration_authority import validate_authority
          from scripts.runtime_sql_schema import managed_tables, inspect_schema, structure_digest
          async def build():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'])
              assert await conn.fetchval("SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public'") == 0
              await conn.close()
              await runner.main()
              conn = await asyncpg.connect(os.environ['DATABASE_URL'])
              try:
                  root = Path.cwd()
                  structures = await inspect_schema(conn, managed_tables(root))
                  payload = {'schema_version': 1, 'migration_history_sha256': validate_authority(root)[2],
                             'tables': {name: structure_digest(value) for name, value in structures.items()}}
                  Path(os.environ['RUNNER_TEMP'], 'runtime-sql-schema.v1.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
                  Path(os.environ['RUNNER_TEMP'], 'reference-structures.json').write_text(json.dumps(structures, indent=2, sort_keys=True) + '\n')
                  print('REFERENCE_TABLE_COUNT=' + str(len(structures)))
              finally:
                  await conn.close()
          asyncio.run(build())
          PY
          git show -s --format='%H %T' HEAD > "$RUNNER_TEMP/source-identity.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/pr159-schema-source.tar.gz"
          cd "$RUNNER_TEMP"
          sha256sum runtime-sql-schema.v1.json reference-structures.json source-identity.txt pr159-schema-source.tar.gz > schema-reference.sha256
          echo 'PRODUCTION_CHANGED=false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr159-disposable-schema-reference
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-sql-schema.v1.json
            ${{ runner.temp }}/reference-structures.json
            ${{ runner.temp }}/source-identity.txt
            ${{ runner.temp }}/pr159-schema-source.tar.gz
            ${{ runner.temp }}/schema-reference.sha256
