name: Middleware issue repair verification
on:
  push:
    branches: [fix/middleware-issues-audit-20260907]
    paths: [.github/workflows/middleware-issues-source-audit.yml]
permissions:
  contents: read

env:
  PARENT_SHA: d93f1c83141580a984a91c7736fb448ca9195f17
  VERIFIED_TREE: deae895545ff1309193480133a5f452649722318
  ALLOWED_PATHS: |
    .codestra/permissions.yaml
    .codestra/runbook.md
    .github/workflows/required-ci.yml
    MIDDLEWARE-AUTHORITY-RECONCILIATION.yaml
    app/api/v1/platform.py
    app/appolon_factory.py
    app/automation_policy.py
    app/automation_v2.py
    app/calling_contract.py
    app/calling_ledger.py
    app/commands.py
    app/core/platform_auth.py
    app/entrypoints/runtime.py
    app/intake_observability.py
    app/main.py
    app/observability_incidents.py
    app/operations.py
    app/replay.py
    app/runtime.py
    contracts/platform/service-bundle.v1.schema.json
    scripts/run_ci.sh
    scripts/staging_synthetic_acceptance.py
    scripts/validate_ci_isolation.py
    scripts/validate_codestra_manifest.py
    scripts/validate_middleware_authority_convergence.py
    scripts/validate_production_runtime_deployment.py
    tests/test_ci_isolation.py
    tests/test_codestra_manifest_validation.py
    tests/test_entrypoints.py
    tests/test_integration_manifest_health.py
    tests/test_middleware_authority_convergence.py
    tests/test_middleware_forward_release_authority_strictness.py
    tests/test_platform_contract.py
    tests/test_platform_verified_authority.py
    tests/test_runtime.py

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: middleware_rehearsal
          POSTGRES_USER: middleware_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U middleware_ci -d middleware_rehearsal"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out exact reviewed repair parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PARENT_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct hash-verified source-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PARENT_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess, urllib.request, zlib
          from pathlib import Path
          parts = ['b04ea7c66c2ecdc0c37163774d6fdefc9c11b3e7', 'dfc162eaee12d801c438ce8a5fb9ddf8fcf47c2d', '0f154f1b5a17ab77cb70bb5845e57e7b8a1b2b10', 'd53a39fd3cafaf07c3fef7f4e3c79815e7a31519']
          def blob(sha):
              req = urllib.request.Request('https://api.github.com/repos/appolon1908-hue/Middleware-/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  row = json.load(response)
              data = base64.b64decode(row['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if actual != sha or row['sha'] != sha:
                  raise SystemExit('input blob mismatch')
              return data
          compressed = b''.join(blob(sha) for sha in parts)
          if hashlib.sha256(compressed).hexdigest() != '8fd79200bdd3a8a6fed5411f512d151e1b95a13f565d7055fac4c026e0df5e5a':
              raise SystemExit('compressed patch mismatch')
          patch = lzma.decompress(compressed)
          if len(patch) != 107010 or hashlib.sha256(patch).hexdigest() != 'd3582d20a4cddef6a45108dd15d72c458318f0ea763a5a753016950ddce2d59c':
              raise SystemExit('source patch mismatch')
          delta = zlib.decompress(blob('18dba2b5275a364ed8b6c927ba8929e249eb995d'))
          if hashlib.sha256(delta).hexdigest() != 'e100828a4e3f502c6ae772ab2f6433a6f6ead63fd8aa37d7049202d081272c6d':
              raise SystemExit('readiness fixture patch mismatch')
          for data in (patch, delta):
              subprocess.run(['git', 'apply', '--check', '--index', '-'], input=data, check=True)
              subprocess.run(['git', 'apply', '--index', '-'], input=data, check=True)
          allowed = set(os.environ['ALLOWED_PATHS'].splitlines())
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('repair file allowlist mismatch')
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          if tree != os.environ['VERIFIED_TREE']:
              raise SystemExit('reconstructed tree mismatch')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('RECONSTRUCTED_TREE=' + tree)
          print('PRODUCTION_CHANGED=NO')
          PY
      - name: Set up release-compatible Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r requirements.lock -r requirements-test.lock
          python -m pip check
      - name: Validate all repaired and previously failing type targets
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os, subprocess
          changed = {p for p in os.environ['ALLOWED_PATHS'].splitlines() if p.endswith('.py')}
          previous = set(subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', os.environ['PARENT_SHA'], '--', '*.py'], text=True).splitlines())
          targets = sorted(changed | previous)
          subprocess.run(['ruff', 'check', '--select', 'E9,F63,F7,F82', 'app', 'tests'], check=True)
          subprocess.run(['ruff', 'check', *targets], check=True)
          subprocess.run(['mypy', '--ignore-missing-imports', '--explicit-package-bases', *targets], check=True)
          PY
      - name: Execute repaired isolated required-CI gates
        env:
          TARGET_SHA: ${{ env.PARENT_SHA }}
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os, subprocess, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path('.github/workflows/required-ci.yml').read_text())
          names = [
              'Assert isolated dependency and fail-closed configuration',
              'Build Docker test target',
              'Run migration chain and database tests',
              'Verify rollback by isolated restoration',
              'Application startup and disabled defaults',
              'Certify required-database readiness failure modes',
          ]
          steps = {step.get('name'): step for step in workflow['jobs']['test']['steps']}
          for name in names:
              step = steps[name]
              print('::group::' + name, flush=True)
              env = {**os.environ, **{key: str(value) for key, value in step.get('env', {}).items()}}
              subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], env=env, check=True)
              print('::endgroup::', flush=True)
          print('REPAIRED_REQUIRED_CI_GATES=PASS')
          PY
      - name: Validate repository governance and manifest source gates
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
      - name: Package only exact verified source replacements
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$VERIFIED_TREE"
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'verified-issue-repair'
          out.mkdir()
          rows = []
          for name in sorted(os.environ['ALLOWED_PATHS'].splitlines()):
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('nonregular replacement')
              data = path.read_bytes()
              target = out / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, target)
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              rows.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest = {'parent': os.environ['PARENT_SHA'], 'tree_sha': os.environ['VERIFIED_TREE'], 'runtime_changed': False, 'files': rows}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-issue-repair-${{ github.sha }}
          path: ${{ runner.temp }}/verified-issue-repair/
          if-no-files-found: error
          retention-days: 7

  store-verified-blobs:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout or repository code execution in this write-capable job.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-issue-repair-${{ github.sha }}
          path: ${{ runner.temp }}/verified-issue-repair
      - name: Store allowlisted verified blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          root = (Path(os.environ['RUNNER_TEMP']) / 'verified-issue-repair').resolve()
          manifest = json.loads((root / 'manifest.json').read_text())
          if manifest['parent'] != os.environ['PARENT_SHA'] or manifest['tree_sha'] != os.environ['VERIFIED_TREE'] or manifest['runtime_changed'] is not False:
              raise SystemExit('source boundary mismatch')
          rows = manifest['files']
          allowed = set(os.environ['ALLOWED_PATHS'].splitlines())
          if len(rows) != len(allowed) or {row['path'] for row in rows} != allowed:
              raise SystemExit('file allowlist mismatch')
          for row in rows:
              path = root / row['path']
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root) or row['mode'] not in {'100644', '100755'}:
                  raise SystemExit('invalid source path')
              data = path.read_bytes()
              if hashlib.sha256(data).hexdigest() != row['sha256'] or hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() != row['sha']:
                  raise SystemExit('source digest mismatch')
          for row in rows:
              data = (root / row['path']).read_bytes()
              request = urllib.request.Request('https://api.github.com/repos/appolon1908-hue/Middleware-/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result['sha'] != row['sha']:
                  raise SystemExit('stored digest mismatch')
              del row['sha256']
          target = Path(os.environ['RUNNER_TEMP']) / 'tree-elements.json'
          target.write_text(json.dumps({'parent': manifest['parent'], 'tree_sha': manifest['tree_sha'], 'tree': rows}, indent=2) + '\n')
          print('VERIFIED_BLOBS_STORED=' + str(len(rows)))
          print('REPOSITORY_REFS_CHANGED=NO')
          print('PRODUCTION_CHANGED=NO')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-issue-tree-${{ github.sha }}
          path: ${{ runner.temp }}/tree-elements.json
          if-no-files-found: error
          retention-days: 7
