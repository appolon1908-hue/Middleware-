name: Apply PR94 review fixes

on:
  push:
    branches:
      - chatgpt/provider-control-runtime-v3-20260902

permissions:
  contents: write

concurrency:
  group: apply-pr94-review-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/provider-control-runtime-v3-20260902
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply credential-normalization and retry-state fixes
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path("app/provider_control_api.py")
          provider = provider_path.read_text(encoding="utf-8")
          if "import re\n" not in provider:
              provider = provider.replace("import json\n", "import json\nimport re\n", 1)
          old_key = '''                for raw_key, nested in item.items():
                      key = str(raw_key).strip().lower()
                      if key in SENSITIVE_PAYLOAD_KEYS or key.endswith(
                          SENSITIVE_PAYLOAD_KEY_SUFFIXES
                      ):
          '''
          new_key = '''                for raw_key, nested in item.items():
                      raw = str(raw_key).strip()
                      key = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\\1_\\2", raw)
                      key = re.sub(r"([a-z0-9])([A-Z])", r"\\1_\\2", key)
                      key = re.sub(r"[^A-Za-z0-9]+", "_", key).strip("_").lower()
                      if key in SENSITIVE_PAYLOAD_KEYS or key.endswith(
                          SENSITIVE_PAYLOAD_KEY_SUFFIXES
                      ):
          '''
          if new_key not in provider:
              if old_key not in provider:
                  raise SystemExit("provider credential-key validation block drifted")
              provider = provider.replace(old_key, new_key, 1)
          provider_path.write_text(provider, encoding="utf-8")

          commands_path = Path("app/commands.py")
          commands = commands_path.read_text(encoding="utf-8")
          old_memory = '            updates = {"state": "queued"}\n'
          new_memory = '            updates = {"state": "queued", "last_error": None}\n'
          if new_memory not in commands:
              if old_memory not in commands:
                  raise SystemExit("memory retry-state block drifted")
              commands = commands.replace(old_memory, new_memory, 1)
          old_postgres = '''                           SET state='queued',
                                 resource_version=resource_version+1,
                                 queued_at=now(),
                                 updated_at=now()
          '''
          new_postgres = '''                           SET state='queued',
                                 resource_version=resource_version+1,
                                 queued_at=now(),
                                 last_error=NULL,
                                 updated_at=now()
          '''
          if new_postgres not in commands:
              if old_postgres not in commands:
                  raise SystemExit("PostgreSQL retry-state block drifted")
              commands = commands.replace(old_postgres, new_postgres, 1)
          commands_path.write_text(commands, encoding="utf-8")

          provider_test_path = Path("tests/test_provider_control_api.py")
          provider_test = provider_test_path.read_text(encoding="utf-8")
          alias_test = '''

          def test_provider_control_rejects_normalized_credential_aliases(
              test_settings,
          ) -> None:
              spec = PROVIDER_CONTROL_SPECS[0]
              app = create_app(
                  settings=test_settings,
                  runtime=_runtime(test_settings, capabilities_enabled=True),
              )
              forbidden_keys = (
                  "accessToken",
                  "clientSecret",
                  "api-key",
                  "refresh token",
                  "privateKey",
                  "ProviderCredentials",
              )
              with TestClient(app) as client:
                  for index, forbidden_key in enumerate(forbidden_keys):
                      response = client.post(
                          spec.route,
                          headers=_headers(
                              spec,
                              idempotency_key=f"credential-alias-{index}",
                          ),
                          json={
                              "operation_id": str(uuid4()),
                              "payload": {
                                  "nested": {
                                      forbidden_key: "must-not-enter-ledger",
                                  },
                              },
                          },
                      )
                      assert response.status_code == 400
                      assert response.json()["error"]["code"] == "invalid_request"
          '''
          if "test_provider_control_rejects_normalized_credential_aliases" not in provider_test:
              provider_test_path.write_text(
                  provider_test.rstrip() + alias_test + "\n",
                  encoding="utf-8",
              )

          operations_path = Path("tests/test_operations.py")
          operations = operations_path.read_text(encoding="utf-8")
          old_operations_assert = '''    assert retried.state == "queued"
              assert retried.resource_version == 2
          '''
          new_operations_assert = '''    assert retried.state == "queued"
              assert retried.resource_version == 2
              assert retried.last_error is None
          '''
          if new_operations_assert not in operations:
              if old_operations_assert not in operations:
                  raise SystemExit("memory retry regression assertion drifted")
              operations_path.write_text(
                  operations.replace(old_operations_assert, new_operations_assert, 1),
                  encoding="utf-8",
              )

          integration_path = Path("tests/integration/test_postgres_redis.py")
          integration = integration_path.read_text(encoding="utf-8")
          old_integration_assert = '''    assert retried.state == "queued" and retried.resource_version == 2
              async with pool.acquire() as conn:
                  row = await conn.fetchrow(
          '''
          new_integration_assert = '''    assert retried.state == "queued" and retried.resource_version == 2
              assert retried.last_error is None
              async with pool.acquire() as conn:
                  persisted_last_error = await conn.fetchval(
                      """SELECT last_error FROM middleware_commands
                         WHERE tenant_id=$1 AND command_id=$2""",
                      command.tenant_id,
                      str(command.command_id),
                  )
                  row = await conn.fetchrow(
          '''
          if new_integration_assert not in integration:
              if old_integration_assert not in integration:
                  raise SystemExit("PostgreSQL retry regression assertion drifted")
              integration = integration.replace(
                  old_integration_assert,
                  new_integration_assert,
                  1,
              )
              integration = integration.replace(
                  '''    assert row is not None and row["event_type"] == command.command_type
          ''',
                  '''    assert persisted_last_error is None
              assert row is not None and row["event_type"] == command.command_type
          ''',
                  1,
              )
              integration_path.write_text(integration, encoding="utf-8")
          PY
          rm -f .github/workflows/apply-pr94-review-fixes.yml
          git add -A
          git diff --cached --check

      - name: Install exact locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m venv .venv-review
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --upgrade pip
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --require-hashes -r requirements-test.txt

      - name: Run focused review regressions
        run: |
          set -Eeuo pipefail
          .venv-review/bin/python -m pytest -q \
            tests/test_provider_control_api.py \
            tests/test_operations.py \
            tests/test_temporal_transport.py

      - name: Run complete locked source certification
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          git diff --check
          git diff --cached --check

      - name: Commit and push review fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "ChatGPT repository remediation"
          git config user.email "noreply@openai.com"
          git commit -m "fix: normalize secret aliases and clear retry errors"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/chatgpt/provider-control-runtime-v3-20260902"
