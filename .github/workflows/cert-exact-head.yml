name: Cert exact-head Middleware validation

on:
  push:
    branches:
      - cert2/unified-intake-exact-ci

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact pushed SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Run authoritative fail-closed validation
        env:
          APP_ENV: test
          ALLOW_IN_MEMORY_STORAGE: "true"
          LIVE_WRITES: "false"
          ODOO_WRITE: "false"
          CALLBACK_DISPATCH: "false"
        run: |
          bash scripts/run_ci.sh
          python -m pytest -q tests/test_lead_delivery.py tests/test_lead_intake_api.py
