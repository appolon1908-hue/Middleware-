name: Run production transfer patch v2

on:
  push:
    branches:
      - deploy/middleware-production-certification-v2-20260903
    paths:
      - ".github/workflows/run-production-transfer-patch-v2.yml"

permissions:
  contents: write

concurrency:
  group: run-production-transfer-patch-v2
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact patch trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install isolated test runner
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pytest==8.4.2

      - name: Patch and validate
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "deploy/middleware-production-certification-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 .automation/patch_production_transfer_options.py
          python3 scripts/validate_production_runtime_deployment.py source
          python3 -m pytest -q tests/test_production_runtime_deployment.py
          bash -n deploy/production/server/codestra-middleware-deploy
          bash -n deploy/production/server/codestra-middleware-backup
          bash -n deploy/production/server/install-restricted-command.sh

      - name: Create final clean commit
        run: |
          set -Eeuo pipefail
          rm -f .automation/patch_production_transfer_options.py
          rm -f .github/workflows/patch-production-transfer-options.yml
          rm -f .github/workflows/run-production-transfer-patch.yml
          rm -f .github/workflows/run-production-transfer-patch-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deploy): use the correct secure SCP port option"
          patch_sha="$(git rev-parse HEAD)"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha" >> "$GITHUB_STEP_SUMMARY"
          set +e
          git push origin "HEAD:$GITHUB_REF_NAME"
          push_exit=$?
          set -e
          printf 'PATCH_PUSH_EXIT=%s\n' "$push_exit"
