groups:
  - name: codestra-middleware-fast-ack
    rules:
      - alert: MiddlewareFastAckP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(codestra_fast_ack_seconds_bucket[5m]))) > 0.25
        for: 10m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/middleware-fast-ack"}
      - alert: MiddlewareDeliveryDeadLetters
        expr: sum(codestra_dlq_depth) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/middleware-dlq"}
      - alert: MiddlewareDeliveryQueueOld
        expr: max(codestra_delivery_oldest_seconds) > 900
        for: 10m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/middleware-backpressure"}
      - alert: MiddlewareAuthenticationFailures
        expr: sum(rate(codestra_auth_failures_total[5m])) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/middleware-authentication"}
  - name: codestra-invalid-event-quarantine
    rules:
      - alert: MiddlewareQuarantineRateHigh
        expr: sum(increase(quarantine_events_total[10m])) > 25
        for: 5m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/invalid-event-quarantine"}
      - alert: MiddlewareQuarantineRatioHigh
        expr: sum(rate(quarantine_events_total[15m])) / clamp_min(sum(rate(quarantine_events_total[15m])) + sum(rate(canonical_events_accepted_total[15m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/invalid-event-quarantine"}
      - alert: MiddlewareQuarantineOldPending
        expr: quarantine_oldest_pending_seconds > 3600
        for: 15m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/invalid-event-quarantine"}
      - alert: MiddlewareQuarantineReprocessingFailures
        expr: sum(increase(quarantine_reprocessing_failures_total[10m])) > 0
        for: 1m
        labels: {severity: critical}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/quarantine-reprocessing"}
      - alert: MiddlewareQuarantineCleanupFailures
        expr: sum(increase(quarantine_cleanup_total{result="failure"}[30m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/quarantine-retention"}
      - alert: MiddlewareSecurityRejectionSpike
        expr: sum(increase(security_rejections_total[5m])) > 50
        for: 2m
        labels: {severity: warning}
        annotations: {runbook_url: "https://monitoring.codestra.co/runbooks/middleware-authentication"}
