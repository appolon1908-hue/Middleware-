openapi: 3.1.0
info:
  title: Codestra Middleware Observability Alert API
  version: 1.0.0
  description: >-
    Fixed-recipient, durable Alertmanager ingress. Each request contains exactly
    one alert transition so validation, idempotency and durable persistence are
    atomic. The API does not expose arbitrary SMTP.
servers:
  - url: https://middleware-observability-alerts.internal.codestra.co
paths:
  /health:
    get:
      operationId: healthObservabilityAlerts
      security: []
      responses:
        '200': {description: Process health}
    head:
      operationId: headHealthObservabilityAlerts
      security: []
      responses:
        '200': {description: Process health}
  /readiness:
    get:
      operationId: readinessObservabilityAlerts
      security: []
      responses:
        '200': {description: Durable dependencies ready}
        '503': {$ref: '#/components/responses/Problem'}
  /version:
    get:
      operationId: versionObservabilityAlerts
      security: []
      responses:
        '200': {description: Immutable release identity}
  /capabilities:
    get:
      operationId: capabilitiesObservabilityAlerts
      security: []
      responses:
        '200': {description: Non-secret effective alert policy}
  /v1/observability/alerts:
    post:
      operationId: submitObservabilityAlert
      summary: Persist one Alertmanager transition as one durable command
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertmanagerWebhook'}
      responses:
        '202': {description: A new durable operation was accepted}
        '200': {description: Exact idempotent replay}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/observability/alerts/{operation_id}:
    get:
      operationId: getObservabilityAlert
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Durable operation state}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/observability/alerts/{operation_id}/events:
    get:
      operationId: listObservabilityAlertEvents
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Append-only operation events}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/observability/alert-delivery-events:
    post:
      operationId: acceptObservabilityAlertDeliveryEvent
      summary: Durably ingest a Klyrow alert delivery event
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/TenantId'}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertDeliveryEvent'}
      responses:
        '202': {description: New event accepted into the durable inbox}
        '200': {description: Idempotent event replay}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: {type: string, const: codestra-platform}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 180}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 180}
    OperationId:
      name: operation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: Fail-closed problem response
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        correlation_id: {type: string}
        retryable: {type: boolean}
    AlertmanagerWebhook:
      type: object
      additionalProperties: false
      required:
        - version
        - groupKey
        - truncatedAlerts
        - status
        - receiver
        - groupLabels
        - commonLabels
        - commonAnnotations
        - externalURL
        - alerts
      properties:
        version: {const: '4'}
        groupKey: {type: string, minLength: 1, maxLength: 2048}
        truncatedAlerts: {type: integer, const: 0}
        status: {enum: [firing, resolved]}
        receiver: {type: string, const: codestra-observability-email}
        groupLabels: {type: object, additionalProperties: {type: string}}
        commonLabels: {type: object, additionalProperties: {type: string}}
        commonAnnotations: {type: object, additionalProperties: {type: string}}
        externalURL: {type: string, format: uri, maxLength: 2048}
        alerts:
          type: array
          minItems: 1
          maxItems: 1
          items: {$ref: '#/components/schemas/Alert'}
    Alert:
      type: object
      additionalProperties: false
      required: [status, labels, annotations, startsAt, endsAt, generatorURL, fingerprint]
      properties:
        status: {enum: [firing, resolved]}
        labels:
          type: object
          required: [alertname, severity, service, environment, host]
          additionalProperties: {type: string}
        annotations: {type: object, additionalProperties: {type: string}}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        generatorURL: {type: string, format: uri, maxLength: 2048}
        fingerprint: {type: string, minLength: 1, maxLength: 128}
    AlertDeliveryEvent:
      type: object
      additionalProperties: false
      required: [event_id, operation_id, status, occurred_at]
      properties:
        event_id: {type: string, minLength: 8, maxLength: 128}
        operation_id: {type: string, format: uuid}
        status: {enum: [accepted, queued, sent, delivered, failed, indeterminate]}
        provider_message_id: {type: [string, 'null'], maxLength: 256}
        occurred_at: {type: string, format: date-time}
        safe_metadata:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 512}
