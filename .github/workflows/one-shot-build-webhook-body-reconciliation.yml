              if row is None:
                  return "unreferenced"
              if (
                  str(row["body_sha256"]) == body_sha256
                  and str(row["encrypted_body_reference"])
                  == encrypted_body_reference
              ):
                  return "accepted"
              return "rejected"

'''
          if repository.count(repository_anchor) != 1:
              raise SystemExit("repository webhook persistence anchor changed")
          repository = repository.replace(
              repository_anchor,
              repository_method + repository_anchor,
              1,
          )
          repository_path.write_text(repository, encoding="utf-8")

          app_path = Path(
              "services/connector-runtime/src/codestra_connector_runtime/api/app.py"
