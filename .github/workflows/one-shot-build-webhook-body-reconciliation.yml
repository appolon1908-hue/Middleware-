name: One-shot build durable webhook-body reconciliation

on:
  push:
    branches:
      - remediation/middleware-body-cleanup-builder-20260903
    paths:
      - .github/workflows/one-shot-build-webhook-body-reconciliation.yml

permissions:
  contents: write

concurrency:
  group: middleware-webhook-body-reconciliation-20260903
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUTHORITY_SHA: 83d41e37227ca6c852366b649d8d038d07112c7e
      TARGET_BRANCH: fix/webhook-body-reconciliation-20260903
    steps:
      - name: Check out exact builder trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Build, test, and publish current-main remediation
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          actual_main="$(git rev-parse refs/remotes/origin/main)"
          [[ "$actual_main" == "$AUTHORITY_SHA" ]] || {
            echo "ERROR=main_moved expected=$AUTHORITY_SHA actual=$actual_main" >&2
            exit 1
          }
          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "ERROR=target_branch_exists branch=$TARGET_BRANCH" >&2
            exit 1
          fi
          git checkout --detach "$AUTHORITY_SHA"

          cat > services/connector-runtime/src/codestra_connector_runtime/api/crypto.py <<'PYCODE'
          """Durable encrypted raw-webhook body storage and reconciliation journal."""

          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import tempfile
          import time
          from dataclasses import dataclass
          from pathlib import Path

          from cryptography.hazmat.primitives.ciphers.aead import AESGCM


          @dataclass(frozen=True, slots=True)
          class PendingBodyRecord:
              """Credential-free evidence for a body awaiting database reconciliation."""

              reference: str
              tenant_id: str
              webhook_id: str
              event_id: str
              body_sha256: str
              created_at: float


          @dataclass(frozen=True, slots=True)
          class EncryptedBodyStore:
              root: Path
              key: bytes

              @classmethod
              def from_key_file(cls, root: Path, key_file: Path) -> "EncryptedBodyStore":
                  raw = key_file.read_bytes().strip()
                  try:
                      decoded = base64.b64decode(raw, validate=True)
                  except Exception:
                      decoded = raw
                  if len(decoded) not in {16, 24, 32}:
                      raise ValueError("body encryption key must be 16, 24, or 32 bytes")
                  root.mkdir(parents=True, exist_ok=True, mode=0o700)
                  os.chmod(root, 0o700)
                  store = cls(root=root, key=decoded)
                  store.reconciliation_root.mkdir(
                      parents=True,
                      exist_ok=True,
                      mode=0o700,
                  )
                  os.chmod(store.reconciliation_root, 0o700)
                  return store

              @property
              def reconciliation_root(self) -> Path:
                  return self.root / ".pending-reconciliation"

              @staticmethod
              def _fsync_directory(path: Path) -> None:
                  if os.name == "nt":
                      return
                  directory_fd = os.open(path, os.O_RDONLY)
                  try:
                      os.fsync(directory_fd)
                  finally:
                      os.close(directory_fd)

              @staticmethod
              def _relative_reference(reference: str) -> Path:
                  if not reference.startswith("file:"):
                      raise ValueError("unsupported encrypted body reference")
                  relative = Path(reference.removeprefix("file:"))
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError("invalid encrypted body reference")
                  return relative

              def _target(self, reference: str) -> Path:
                  return self.root / self._relative_reference(reference)

              def _pending_path(self, reference: str) -> Path:
                  self._relative_reference(reference)
                  digest = hashlib.sha256(reference.encode("utf-8")).hexdigest()
                  return self.reconciliation_root / f"{digest}.json"

              def _write_pending_record(self, record: PendingBodyRecord) -> None:
                  self.reconciliation_root.mkdir(
                      parents=True,
                      exist_ok=True,
                      mode=0o700,
                  )
                  payload = {
                      "schema_version": 1,
                      "reference": record.reference,
                      "tenant_id": record.tenant_id,
                      "webhook_id": record.webhook_id,
                      "event_id": record.event_id,
                      "body_sha256": record.body_sha256,
                      "created_at": record.created_at,
                  }
                  target = self._pending_path(record.reference)
                  file_descriptor, temporary_path = tempfile.mkstemp(
                      prefix=".pending-record-",
                      dir=self.reconciliation_root,
                  )
                  try:
                      with os.fdopen(
                          file_descriptor,
                          "w",
                          encoding="utf-8",
                      ) as stream:
                          json.dump(
                              payload,
                              stream,
                              ensure_ascii=False,
                              separators=(",", ":"),
                              sort_keys=True,
                          )
                          stream.write("\n")
                          stream.flush()
                          os.fsync(stream.fileno())
                      os.chmod(temporary_path, 0o600)
                      os.replace(temporary_path, target)
                      self._fsync_directory(self.reconciliation_root)
                  finally:
                      if os.path.exists(temporary_path):
                          os.unlink(temporary_path)

              def persist(
                  self,
                  body: bytes,
                  *,
                  tenant_id: str,
                  webhook_id: str,
                  event_id: str,
              ) -> str:
                  reference, _ = self.persist_with_status(
                      body,
                      tenant_id=tenant_id,
                      webhook_id=webhook_id,
                      event_id=event_id,
                  )
                  return reference

              def persist_with_status(
                  self,
                  body: bytes,
                  *,
                  tenant_id: str,
                  webhook_id: str,
                  event_id: str,
              ) -> tuple[str, bool]:
                  """Persist a body and durably journal its unresolved DB outcome."""
                  body_digest = hashlib.sha256(body).hexdigest()
                  safe_event = hashlib.sha256(
                      event_id.encode("utf-8")
                  ).hexdigest()[:24]
                  relative = (
                      Path(tenant_id)
                      / webhook_id
                      / f"{safe_event}-{body_digest}.bin"
                  )
                  reference = "file:" + relative.as_posix()
                  target = self.root / relative
                  target.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                  os.chmod(target.parent, 0o700)

                  pending = PendingBodyRecord(
                      reference=reference,
                      tenant_id=tenant_id,
                      webhook_id=webhook_id,
                      event_id=event_id,
                      body_sha256=body_digest,
                      created_at=time.time(),
                  )
                  if target.exists():
                      self._write_pending_record(pending)
                      return reference, False

                  nonce = os.urandom(12)
                  associated = (
                      f"{tenant_id}:{webhook_id}:{event_id}:{body_digest}"
                  ).encode("utf-8")
                  ciphertext = AESGCM(self.key).encrypt(nonce, body, associated)
                  payload = b"CRB1" + nonce + ciphertext
                  file_descriptor, temporary_path = tempfile.mkstemp(
                      prefix=".pending-body-",
                      dir=target.parent,
                  )
                  try:
                      with os.fdopen(file_descriptor, "wb") as stream:
                          stream.write(payload)
                          stream.flush()
                          os.fsync(stream.fileno())
                      os.chmod(temporary_path, 0o600)
                      # Journal first. A crash before body promotion leaves a
                      # harmless record; the inverse order can leave an orphan.
                      self._write_pending_record(pending)
                      os.replace(temporary_path, target)
                      self._fsync_directory(target.parent)
                  finally:
                      if os.path.exists(temporary_path):
                          os.unlink(temporary_path)
                  return reference, True

              def scan_pending_records(
                  self,
                  *,
                  older_than_seconds: int = 300,
                  now: float | None = None,
              ) -> tuple[list[PendingBodyRecord], int]:
                  """Return mature records and count malformed records safely."""
                  if older_than_seconds < 0:
                      raise ValueError("older_than_seconds must be non-negative")
                  current = time.time() if now is None else now
                  cutoff = current - older_than_seconds
                  records: list[PendingBodyRecord] = []
                  invalid = 0
                  if not self.reconciliation_root.exists():
                      return records, invalid
                  for path in sorted(self.reconciliation_root.glob("*.json")):
                      try:
                          value = json.loads(path.read_text(encoding="utf-8"))
                          if value.get("schema_version") != 1:
                              raise ValueError("unsupported pending record schema")
                          record = PendingBodyRecord(
                              reference=str(value["reference"]),
                              tenant_id=str(value["tenant_id"]),
                              webhook_id=str(value["webhook_id"]),
                              event_id=str(value["event_id"]),
                              body_sha256=str(value["body_sha256"]),
                              created_at=float(value["created_at"]),
                          )
                          self._relative_reference(record.reference)
                          if not (
                              len(record.body_sha256) == 64
                              and all(
                                  character in "0123456789abcdef"
                                  for character in record.body_sha256
                              )
                          ):
                              raise ValueError("invalid body digest")
                      except (
                          OSError,
                          KeyError,
                          TypeError,
                          ValueError,
                          json.JSONDecodeError,
                      ):
                          invalid += 1
                          continue
                      if record.created_at <= cutoff:
                          records.append(record)
                  return records, invalid

              def has_pending(self, reference: str) -> bool:
                  return self._pending_path(reference).is_file()

              def mark_accepted(self, reference: str) -> None:
                  """Clear reconciliation evidence but retain the accepted body."""
                  self._pending_path(reference).unlink(missing_ok=True)
                  if self.reconciliation_root.exists():
                      self._fsync_directory(self.reconciliation_root)

              def discard_pending(self, reference: str) -> None:
                  """Delete a rejected body, then clear its durable retry record."""
                  self.remove(reference)
                  self.mark_accepted(reference)

              def read(
                  self,
                  reference: str,
                  *,
                  tenant_id: str,
                  webhook_id: str,
                  event_id: str,
                  body_sha256: str,
              ) -> bytes:
                  payload = self._target(reference).read_bytes()
                  if len(payload) < 4 + 12 + 16 or payload[:4] != b"CRB1":
                      raise ValueError("encrypted body record is invalid")
                  nonce = payload[4:16]
                  ciphertext = payload[16:]
                  associated = (
                      f"{tenant_id}:{webhook_id}:{event_id}:{body_sha256}"
                  ).encode("utf-8")
                  body = AESGCM(self.key).decrypt(nonce, ciphertext, associated)
                  if hashlib.sha256(body).hexdigest() != body_sha256:
                      raise ValueError("encrypted body digest does not match")
                  return body

              def remove(self, reference: str) -> None:
                  """Remove a rejected body without permitting path traversal."""
                  self._target(reference).unlink(missing_ok=True)
          PYCODE
          sed -i 's/^          //' services/connector-runtime/src/codestra_connector_runtime/api/crypto.py

          python3 - <<'PY'
          from pathlib import Path

          ingress_path = Path(
              "services/connector-runtime/src/codestra_connector_runtime/api/"
              "webhook_ingress.py"
          )
          ingress = ingress_path.read_text(encoding="utf-8")
          ingress = ingress.replace(
              '_LOG = structlog.get_logger(__name__)\n',
              '_LOG = structlog.get_logger(__name__)\n'
              '_BODY_RECONCILIATION_GRACE_SECONDS = 300\n',
              1,
          )
          method_anchor = '    async def accept(\n'
          reconciliation_method = '''    def reconcile_pending_bodies(
              self,
              *,
              grace_seconds: int = _BODY_RECONCILIATION_GRACE_SECONDS,
              now: float | None = None,
          ) -> dict[str, int]:
              """Resolve durable body claims without racing active deliveries."""
              records, invalid = self.body_store.scan_pending_records(
                  older_than_seconds=grace_seconds,
                  now=now,
              )
              result = {
                  "examined": len(records),
                  "retained": 0,
                  "removed": 0,
                  "deferred": 0,
                  "invalid": invalid,
              }
              for record in records:
                  try:
                      state = self.repository.webhook_body_reference_state(
                          tenant_id=UUID(record.tenant_id),
                          webhook_id=UUID(record.webhook_id),
                          event_id=record.event_id,
                          body_sha256=record.body_sha256,
                          encrypted_body_reference=record.reference,
                      )
                  except Exception as error:
                      result["deferred"] += 1
                      _LOG.warning(
                          "encrypted_webhook_body_reconciliation_deferred",
                          error_type=type(error).__name__,
                      )
                      continue
                  try:
                      if state == "accepted":
                          self.body_store.mark_accepted(record.reference)
                          result["retained"] += 1
                      elif state in {"rejected", "unreferenced"}:
                          self.body_store.discard_pending(record.reference)
                          result["removed"] += 1
                      else:
                          result["deferred"] += 1
                          _LOG.error(
                              "encrypted_webhook_body_reconciliation_state_invalid",
                              state=state,
                          )
                  except OSError as error:
                      result["deferred"] += 1
                      _LOG.warning(
                          "encrypted_webhook_body_cleanup_retry_required",
                          error_type=type(error).__name__,
                      )
              return result

'''
          if ingress.count(method_anchor) != 1:
              raise SystemExit("webhook accept anchor changed")
          ingress = ingress.replace(
              method_anchor,
              reconciliation_method + method_anchor,
              1,
          )
          enabled_anchor = '''        if not self.settings.webhook_ingress_enabled:
              raise ProblemError(
                  status=503,
                  code="WEBHOOK_INGRESS_DISABLED",
                  title="Webhook ingress disabled",
                  detail="Webhook ingress is disabled by runtime policy.",
              )
'''
          enabled_replacement = enabled_anchor + '''        reconciliation = self.reconcile_pending_bodies()
              if reconciliation["deferred"] or reconciliation["invalid"]:
                  _LOG.warning(
                      "encrypted_webhook_body_reconciliation_incomplete",
                      **reconciliation,
                  )
'''
          if ingress.count(enabled_anchor) != 1:
              raise SystemExit("webhook ingress enable anchor changed")
          ingress = ingress.replace(enabled_anchor, enabled_replacement, 1)
          start = ingress.index('        reference, body_created = self.body_store.persist_with_status(')
          end = ingress.index('        return 202, {', start)
          replacement = '''        reference, body_created = self.body_store.persist_with_status(
              body,
              tenant_id=tenant_id,
              webhook_id=str(webhook_id),
              event_id=event_id,
          )
          correlation_id = UUID(
              str(getattr(request.state, "correlation_id", uuid4()))
          )
          try:
              duplicate, inbox_id = self.repository.persist_verified_webhook(
                  ingress=ingress,
                  event_id=event_id,
                  body_sha256=body_sha256,
                  encrypted_body_reference=reference,
                  signature_version="codestra-hmac-sha256-v1",
                  correlation_id=correlation_id,
                  traceparent=request.headers.get("traceparent"),
              )
          except ProblemError as error:
              if error.code == "WEBHOOK_SEMANTIC_CONFLICT":
                  try:
                      self.body_store.discard_pending(reference)
                  except OSError as cleanup_error:
                      _LOG.error(
                          "encrypted_webhook_body_cleanup_retry_required",
                          error_type=type(cleanup_error).__name__,
                          body_created=body_created,
                      )
              raise
          except Exception as error:
              # The durable pending record survives a rollback, lost response,
              # or process error. A later reconciliation query decides whether
              # the database committed before either retaining or deleting it.
              _LOG.warning(
                  "encrypted_webhook_body_outcome_deferred",
                  error_type=type(error).__name__,
                  body_created=body_created,
              )
              raise
          else:
              try:
                  self.body_store.mark_accepted(reference)
              except OSError as cleanup_error:
                  # Acceptance is already durable. Keep serving the accepted
                  # response and let startup/request reconciliation retry only
                  # the non-secret journal cleanup.
                  _LOG.warning(
                      "encrypted_webhook_body_acceptance_cleanup_deferred",
                      error_type=type(cleanup_error).__name__,
                  )
'''
          ingress = ingress[:start] + replacement + ingress[end:]
          ingress_path.write_text(ingress, encoding="utf-8")

          repository_path = Path(
              "services/connector-runtime/src/codestra_connector_runtime/api/"
              "repository.py"
          )
          repository = repository_path.read_text(encoding="utf-8")
          repository_anchor = '    def persist_verified_webhook(\n'
          repository_method = '''    def webhook_body_reference_state(
              self,
              *,
              tenant_id: UUID,
              webhook_id: UUID,
              event_id: str,
              body_sha256: str,
              encrypted_body_reference: str,
          ) -> str:
              """Classify a journaled body after an uncertain transaction outcome."""
              with self.database.session(tenant_id) as session:
