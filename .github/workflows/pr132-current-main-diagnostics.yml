name: Inspect PR 132 current-main merge

on:
  push:
    branches: [fix/pr132-current-main-diagnostics-20260906]

permissions:
  contents: read

env:
  PR_SOURCE: 01be8b01eae3b10e5a0d603b2b089e131c117e95
  MAIN_SOURCE: 63b6c0c8bca5168a1178895bd12858d0b1e8086e

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: middleware
          POSTGRES_PASSWORD: middleware_ci_only
          POSTGRES_DB: middleware_test_runtime
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U middleware -d middleware_test_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out exact PR source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.PR_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge exact current main without committing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PR_SOURCE"
          git config user.name 'CI merge inspection'
          git config user.email 'ci-inspection@users.noreply.github.com'
          set +e
          git -c core.hooksPath=/dev/null merge --no-commit --no-ff "$MAIN_SOURCE"
          code=$?
          set -e
          test "$code" -le 1
          python3 - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          expected = {'contracts/platform/integration-fabric-api.v2.yaml', 'contracts/platform/middleware-openapi.generated.json'}
          if conflicts != expected:
              raise SystemExit(f'unexpected merge conflicts: {sorted(conflicts)}')
          PY
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install merged hash-locked dependencies and regenerate contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --require-hashes -r requirements-test.txt
          python3 -m pip check
          python3 scripts/generate_api_contracts.py
          git add -- contracts/platform/middleware-openapi.generated.json contracts/platform/integration-fabric-api.v2.yaml config/api-completion-matrix.yaml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
      - name: Validate combined source and full regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          python3 -m pytest -q
      - name: Validate combined source on disposable PostgreSQL and Redis
        env:
          RUNTIME_INTEGRATION_TESTS: '1'
          RUNTIME_INTEGRATION_ALLOW_DISPOSABLE: 'YES'
          DATABASE_URL: postgresql://middleware:middleware_ci_only@127.0.0.1:5432/middleware_test_runtime
          REDIS_URL: redis://127.0.0.1:6379/15
        run: bash scripts/integration_ci.sh
      - name: Package exact verified delta relative to current main
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          allowed = set('''app/automation_v2.py
          app/n8n_control_plane.py
          app/runtime.py
          app/service.py
          config/api-completion-matrix.yaml
          config/automation-conformance-waivers.v1.json
          config/automation-workflow-routing.v1.json
          config/test-skip-register.v1.json
          contracts/automation/command-envelope-authority.v1.json
          contracts/automation/n8n-control-plane.v2.json
          contracts/platform/integration-fabric-api.v2.yaml
          contracts/platform/middleware-openapi.generated.json
          docs/decisions/ADR-0002-N4-COMMAND-ENVELOPE-AUTHORITY.md
          migrations/automation/0001_automation_v2.sql
          scripts/generate_api_contracts.py
          scripts/migrate_runtime.py
          scripts/validate_platform_control_plane.py
          tests/integration/test_automation_v2_store.py
          tests/test_automation_v2.py
          tests/test_runtime.py'''.splitlines())
          changed = set(subprocess.check_output(['git', 'diff', os.environ['MAIN_SOURCE'], '--name-only'], text=True).splitlines())
          if not changed or changed - allowed:
              raise SystemExit(f'unexpected candidate delta: {sorted(changed - allowed)}')
          out = Path(os.environ['RUNNER_TEMP']) / 'verified-merge'
          rows = []
          for path in sorted(changed):
              p = Path(path)
              if p.is_symlink() or not p.is_file():
                  raise SystemExit('not a regular source file')
              data = p.read_bytes()
              target = out / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(p, target)
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', path], text=True).split()[0]
              rows.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(), 'sha256': hashlib.sha256(data).hexdigest()})
          manifest = {'pr_source': os.environ['PR_SOURCE'], 'main_source': os.environ['MAIN_SOURCE'], 'tree': rows}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('VERIFIED_DELTA_FILES=' + str(len(rows)))
          PY
      - name: Upload verified merge files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr132-verified-merge-${{ github.sha }}
          path: ${{ runner.temp }}/verified-merge/
          if-no-files-found: error
          retention-days: 7

  store-verified-blobs:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout and no repository code execution in the write-capable job.
      - name: Download verified source files outside a repository
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: pr132-verified-merge-${{ github.sha }}
          path: ${{ runner.temp }}/verified-merge
      - name: Store verified blobs only without changing commits or refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          root = (Path(os.environ['RUNNER_TEMP']) / 'verified-merge').resolve()
          manifest = json.loads((root / 'manifest.json').read_text())
          if manifest['pr_source'] != os.environ['PR_SOURCE'] or manifest['main_source'] != os.environ['MAIN_SOURCE']:
              raise SystemExit('source mismatch')
          rows = manifest['tree']
          if not rows or len(rows) > 20:
              raise SystemExit('invalid file count')
          for row in rows:
              p = root / row['path']
              if not p.resolve().is_relative_to(root) or p.is_symlink() or not p.is_file() or row['mode'] not in {'100644', '100755'}:
                  raise SystemExit('invalid artifact path or mode')
              data = p.read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if hashlib.sha256(data).hexdigest() != row['sha256'] or sha != row['sha']:
                  raise SystemExit('blob digest mismatch')
          for row in rows:
              data = (root / row['path']).read_bytes()
              request = urllib.request.Request(
                  'https://api.github.com/repos/appolon1908-hue/Middleware-/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if result['sha'] != row['sha']:
                  raise SystemExit('stored blob digest mismatch')
              del row['sha256']
          print('TREE_ELEMENTS_JSON=' + json.dumps(rows, separators=(',', ':')))
          print('REPOSITORY_REFS_CHANGED=NO')
          print('PRODUCTION_DEPLOYED=NO')
          PY
