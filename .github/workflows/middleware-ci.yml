name: Middleware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: middleware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-validation:
    name: Validate middleware repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run fail-closed bootstrap validation
        run: bash scripts/run_ci.sh

  runtime-image-smoke:
    name: Build and smoke-test runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build exact-source runtime image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --file Dockerfile.runtime \
            --build-arg "SOURCE_SHA=$SOURCE_SHA" \
            --build-arg "BUILD_TIME=$build_time" \
            --tag "codestra-middleware-ci:$SOURCE_SHA" \
            .

      - name: Prove packaged runtime can construct the application
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --entrypoint python \
            --env APP_ENV=test \
            --env ALLOW_IN_MEMORY_STORAGE=true \
            "codestra-middleware-ci:$SOURCE_SHA" \
            -c "from app.commands import CommandPolicyRegistry; from app.main import create_app; assert CommandPolicyRegistry.load().policies; assert create_app().title == 'Codestra Middleware API'; print('RUNTIME_IMAGE_SMOKE=PASS')"

  runtime-integration:
    name: Disposable PostgreSQL Redis integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: middleware
          POSTGRES_PASSWORD: middleware_ci_only
          POSTGRES_DB: middleware_test_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U middleware -d middleware_test_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run disposable integration suite
        env:
          RUNTIME_INTEGRATION_TESTS: "1"
          RUNTIME_INTEGRATION_ALLOW_DISPOSABLE: "YES"
          DATABASE_URL: postgresql://middleware:middleware_ci_only@127.0.0.1:5432/middleware_test_runtime
          REDIS_URL: redis://127.0.0.1:6379/15
        run: bash scripts/integration_ci.sh

  nats-jetstream-integration:
    name: Disposable NATS JetStream integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exercise isolated JetStream delivery and recovery
        run: bash scripts/nats_integration_ci.sh

  temporal-workflow-integration:
    name: Temporal critical workflow integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Exercise critical Temporal workflows
        run: bash scripts/temporal_integration_ci.sh

  synthetic-acceptance-e2e:
    name: Synthetic no-effect acceptance E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: middleware
          POSTGRES_PASSWORD: middleware_ci_only
          POSTGRES_DB: middleware_test_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U middleware -d middleware_test_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the combined no-effect acceptance journey
        env:
          RUNTIME_INTEGRATION_TESTS: "1"
          RUNTIME_INTEGRATION_ALLOW_DISPOSABLE: "YES"
          DATABASE_URL: postgresql://middleware:middleware_ci_only@127.0.0.1:5432/middleware_test_synthetic
          REDIS_URL: redis://127.0.0.1:6379/15
        run: bash scripts/synthetic_acceptance_ci.sh
