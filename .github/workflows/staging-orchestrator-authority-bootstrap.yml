name: Staging orchestrator authority bootstrap

on:
  push:
    branches:
      - fix/staging-intake-protected-dispatch-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Patch and validate bounded staging authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .codestra/staging_orchestrator_authority_bootstrap.py
          git rm -- .github/workflows/staging-orchestrator-authority-bootstrap.yml
          git rm -- .codestra/staging_orchestrator_authority_bootstrap.py
          python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3 pytest==8.4.2
          python3 -m py_compile .codestra/validate-production-orchestrator-contract.py
          python3 .codestra/validate-production-orchestrator-contract.py
          python3 -m pytest -q \
            tests/test_staging_intake_workflow_authorization.py \
            tests/test_staging_intake_orchestrator_authority.py
          git diff --check

      - name: Commit bounded authority repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .codestra/validate-production-orchestrator-contract.py
          git add -u .github/workflows/staging-orchestrator-authority-bootstrap.yml
          git add -u .codestra/staging_orchestrator_authority_bootstrap.py
          git diff --cached --check
          git commit -m "fix(staging): allow bounded no-effect certification authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
