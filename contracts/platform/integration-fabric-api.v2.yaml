openapi: 3.1.0
info:
  title: Codestra Integration Fabric API
  version: 2.0.0
  description: Contract-first platform, operation, integration, and private automation API.
servers:
  - url: https://api.codestra.co
    description: Public gateway; runtime activation is outside this contract.
paths:
  /v1/runtime/safety:
    get:
      operationId: getRuntimeSafety
      description: Read effective non-secret safety controls from the running process.
      security: [{oauth2: [health.read]}]
      responses:
        '200':
          description: Effective runtime safety controls and immutable release identity
          content:
            application/json:
              schema:
                $ref: '../runtime-safety-readback.v1.schema.json'
        '401': {description: Monitoring identity is missing or invalid}
        '403': {description: Monitoring identity lacks health.read}
  /v1/commands:
    post:
      operationId: submitCommand
      security: [{oauth2: [middleware.request.forward]}]
      parameters:
        - {$ref: '#/components/parameters/HeaderTenantId'}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './command-envelope.v1.schema.json'
      responses:
        '202': {$ref: '#/components/responses/CommandOperation'}
        '200': {$ref: '#/components/responses/CommandOperation'}
        '400': {description: Invalid canonical command or header mismatch}
        '403': {description: Tenant, subject, owner, or capability denied}
        '409': {description: Command identity reused with different content}
  /v1/platform/tenants:
    post:
      operationId: createTenant
      security: [{oauth2: [platform.tenant.create]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}:
    get:
      operationId: getTenant
      security: [{oauth2: [platform.tenant.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: Tenant projection}
    patch:
      operationId: updateTenant
      security: [{oauth2: [platform.tenant.write]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}/preflight:
    post:
      operationId: runTenantPreflight
      security: [{oauth2: [platform.preflight.execute]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}/readiness:
    get:
      operationId: getTenantReadiness
      security: [{oauth2: [platform.readiness.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: Authoritative readiness projection}
  /v1/integrations/catalog:
    get:
      operationId: listIntegrationCatalog
      security: [{oauth2: [integration.catalog.read]}]
      responses:
        '200': {description: Available integration types}
  /v1/integrations/connections:
    post:
      operationId: createIntegrationConnection
      security: [{oauth2: [integration.connection.write]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/integrations/connections/{connection_id}/test:
    post:
      operationId: testIntegrationConnection
      security: [{oauth2: [integration.connection.test]}]
      parameters:
        - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/operations/{command_id}:
    get:
      operationId: getCommandOperation
      security: [{oauth2: [middleware.status.read]}]
      parameters:
        - {name: command_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/HeaderTenantId'}
      responses:
        '200': {$ref: '#/components/responses/CommandOperation'}
        '403': {description: Tenant access denied}
        '404': {description: Command operation not found}
  /v1/operations:
    get:
      operationId: listCommandOperations
      description: Tenant-scoped durable operations. Runtime enforces each configured caller's status_scope for the middleware-api audience.
      security: [{oauth2: [middleware.status.read]}]
      parameters:
        - {$ref: '#/components/parameters/HeaderTenantId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: state, in: query, schema: {type: string}}
        - {name: command_type, in: query, schema: {type: string, maxLength: 180}}
      responses:
        '200': {$ref: '#/components/responses/OperationPage'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {description: Bearer token missing or invalid}
        '403': {description: Configured status scope or tenant access denied}
        '422': {description: Request entity cannot be processed}
        '429': {description: Rate limit exceeded}
        '503': {description: Durable command store unavailable}
  /v1/operations/{command_id}/events:
    get:
      operationId: listCommandOperationEvents
      security: [{oauth2: [middleware.status.read]}]
      parameters: [{$ref: '#/components/parameters/CommandId'}, {$ref: '#/components/parameters/HeaderTenantId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Ordered redacted audit events, content: {application/json: {schema: {$ref: '#/components/schemas/OperationEventPage'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {description: Bearer token missing or invalid}
        '403': {description: Configured status scope or tenant access denied}
        '404': {description: Operation not found}
        '422': {description: Request entity cannot be processed}
        '429': {description: Rate limit exceeded}
        '503': {description: Durable command store unavailable}
  /v1/operations/{command_id}/attempts:
    get:
      operationId: listCommandOperationAttempts
      security: [{oauth2: [middleware.status.read]}]
      parameters: [{$ref: '#/components/parameters/CommandId'}, {$ref: '#/components/parameters/HeaderTenantId'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Ordered safe attempt summaries, content: {application/json: {schema: {$ref: '#/components/schemas/OperationAttemptPage'}}}}
        '404': {description: Operation not found}
        '503': {description: Durable command store unavailable}
  /v1/operations/{command_id}/cancel:
    post:
      operationId: cancelCommandOperation
      description: Versioned durable cancellation request. Runtime enforces the configured caller command_scope and never invokes a provider.
      security: [{oauth2: [middleware.request.forward]}]
      parameters: [{$ref: '#/components/parameters/CommandId'}, {$ref: '#/components/parameters/HeaderTenantId'}, {$ref: '#/components/parameters/CorrelationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationMutationRequest'}}}}
      responses: &operationMutationResponses
        '200': {$ref: '#/components/responses/CommandOperation'}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '401': {description: Bearer token missing or invalid}
        '403': {description: Configured command scope or tenant access denied}
        '404': {description: Operation not found}
        '409': {description: Version, state, or idempotency conflict}
        '422': {description: Request entity cannot be processed}
        '429': {description: Rate limit exceeded}
        '503': {description: Durable command store unavailable}
  /v1/operations/{command_id}/reconcile:
    post:
      operationId: requestCommandOperationReconciliation
      description: Requests durable reconciliation work without provider invocation or command resubmission.
      security: [{oauth2: [middleware.request.forward]}]
      parameters: [{$ref: '#/components/parameters/CommandId'}, {$ref: '#/components/parameters/HeaderTenantId'}, {$ref: '#/components/parameters/CorrelationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OperationMutationRequest'}}}}
      responses: *operationMutationResponses
  /v1/dead-letters/{dead_letter_id}/replay:
    post:
      operationId: requestDeadLetterReplay
      security: [{oauth2: [operations.replay.request]}]
      parameters:
        - {name: dead_letter_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /internal/v1/automation/runs/claim:
    post:
      operationId: claimAutomationRun
      security: [{oauth2: [automation.job.claim]}]
      responses:
        '200': {description: Leased automation run}
        '204': {description: No eligible run}
  /internal/v1/automation/runs/{run_id}/heartbeat:
    post:
      operationId: heartbeatAutomationRun
      security: [{oauth2: [automation.job.heartbeat]}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Lease extended}
        '409': {description: Lease lost}
  /internal/v1/automation/runs/{run_id}/result:
    post:
      operationId: reportAutomationResult
      security: [{oauth2: [automation.job.complete, automation.job.fail]}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Terminal result accepted idempotently}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
          scopes:
            platform.tenant.create: Create a tenant operation
            platform.tenant.read: Read authorized tenant state
            platform.tenant.write: Change authorized tenant state
            platform.preflight.execute: Run a no-effect readiness preflight
            platform.readiness.read: Read authoritative readiness
            integration.catalog.read: Read available integration types
            integration.connection.write: Create or change connection metadata
            integration.connection.test: Request a no-effect connection test
            operation.read: Read operation state
            health.read: Read health and non-secret runtime safety state
            middleware.request.forward: Submit a governed command
            middleware.status.read: Read an authorized command operation
            operations.replay.request: Request protected dead-letter replay
            automation.job.claim: Claim authorized automation work
            automation.job.heartbeat: Extend the current lease
            automation.job.complete: Report successful orchestration
            automation.job.fail: Report failed orchestration
  parameters:
    CommandId:
      name: command_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, description: Opaque pagination position}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    HeaderTenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 180}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 180}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    InvalidRequest:
      description: Canonical validation error
    OperationPage:
      description: Bounded tenant operation page
      content: {application/json: {schema: {$ref: '#/components/schemas/OperationPage'}}}
    CommandOperation:
      description: Current durable command operation
      headers:
        Location:
          schema: {type: string}
        X-Correlation-ID:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandOperation'
    OperationAccepted:
      description: Durable asynchronous operation accepted
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: {type: string, format: uuid}
                  status: {type: string, enum: [accepted]}
              meta:
                type: object
                required: [correlation_id, api_version]
                properties:
                  correlation_id: {type: string, format: uuid}
                  api_version: {const: v1}
  schemas:
    CommandOperation:
      type: object
      additionalProperties: false
      required:
        - command_id
        - tenant_id
        - command_type
        - command_version
        - target
        - requested_by
        - correlation_id
        - idempotency_key
        - capability
        - state
        - created_at
        - updated_at
        - resource_version
        - duplicate
      properties:
        command_id: {type: string, format: uuid}
        tenant_id: {type: string}
        command_type: {type: string}
        command_version: {const: '1.0'}
        target: {type: string}
        requested_by: {type: string}
        correlation_id: {type: string}
        idempotency_key: {type: string}
        capability: {type: string}
        state:
          type: string
          enum:
            - RECEIVED
            - QUEUED
            - SUBMITTED
            - ACCEPTED
            - UNKNOWN
            - COMPLETED
            - FAILED
            - RECONCILIATION_REQUIRED
            - DEAD_LETTERED
            - CANCELLED
        provider_operation_id: {type: [string, 'null']}
        last_error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resource_version: {type: integer, minimum: 1}
        cancelled_at: {type: [string, 'null'], format: date-time}
        cancellation_reason: {type: [string, 'null']}
        reconciliation_requested_at: {type: [string, 'null'], format: date-time}
        reconciliation_reason: {type: [string, 'null']}
        duplicate: {type: boolean}
    OperationMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_version, reason]
      properties:
        expected_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 500}
    OperationPage:
      type: object
      required: [items, next_cursor]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/CommandOperation'}}, next_cursor: {type: [string, 'null']}}
    OperationEventPage:
      type: object
      required: [items, next_cursor]
      properties: {items: {type: array, items: {type: object, required: [event_id, operation_id, new_state, actor_id, reason, safe_metadata, created_at]}}, next_cursor: {type: [string, 'null']}}
    OperationAttemptPage:
      type: object
      required: [items, next_cursor]
      properties: {items: {type: array, items: {type: object, required: [attempt_id, operation_id, attempt_number, state, started_at]}}, next_cursor: {type: [string, 'null']}}
