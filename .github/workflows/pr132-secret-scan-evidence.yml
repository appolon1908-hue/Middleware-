name: Inspect PR 132 secret-scan findings

on:
  push:
    branches: [fix/pr132-current-main-diagnostics-20260906]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f6adc9982fbb5eaf012345701161533783331950
          fetch-depth: 1
          persist-credentials: false
      - name: Scan with the unchanged checksum-pinned release scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = f6adc9982fbb5eaf012345701161533783331950
          mkdir -p "$RUNNER_TEMP/scan-evidence"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/scan-evidence" gitleaks
          set +e
          "$RUNNER_TEMP/scan-evidence/gitleaks" dir . --redact --no-banner --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/redacted-findings.json"
          result=$?
          set -e
          test "$result" -le 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          values = json.loads((root / 'redacted-findings.json').read_text())
          safe = [{key: row[key] for key in ('File', 'StartLine', 'EndLine', 'RuleID', 'Fingerprint') if key in row} for row in values]
          text = json.dumps(safe, indent=2)
          print(text)
          (root / 'scan-evidence/locations.json').write_text(text + '\n')
          PY
          echo REPOSITORY_CHANGED=NO
          echo PRODUCTION_CHANGED=NO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr132-secret-scan-locations
          path: ${{ runner.temp }}/scan-evidence/
          if-no-files-found: error
          retention-days: 7
