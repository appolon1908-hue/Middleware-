[build-system]
requires = ["setuptools==80.9.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "codestra-connector-runtime"
version = "1.0.0"
description = "Production runtime for the Codestra Connector SDK"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.18.4",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.3",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyJWT[crypto]==2.13.0",
  "SQLAlchemy==2.0.50",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL instance"]
