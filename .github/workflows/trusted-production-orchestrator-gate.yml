name: Trusted production orchestrator gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trusted-production-orchestrator-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: trusted-orchestrator-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      COMPARISON_SHA: ${{ github.event.pull_request.base.sha }}
      GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      VALIDATION_ROOT: ${{ github.workspace }}/candidate
    steps:
      - name: Create candidate-bound required check
        id: required-check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const headSha = context.payload.pull_request.head.sha;
            const { data } = await github.rest.checks.create({
              owner,
              repo,
              name: 'orchestrator-contract',
              head_sha: headSha,
              status: 'in_progress',
              details_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              output: {
                title: 'Protected-base validator running',
                summary: 'A protected-main launcher is validating the exact pull-request head as inert candidate data.'
              }
            });
            core.setOutput('check_run_id', String(data.id));

      - name: Check out protected-base trust root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact candidate source as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Import exact protected-base comparison commit
        run: |
          set -Eeuo pipefail
          git -C candidate fetch \
            --no-tags \
            --no-write-fetch-head \
            "$GITHUB_WORKSPACE" \
            "$COMPARISON_SHA"
          test "$(git -C candidate rev-parse "$COMPARISON_SHA^{commit}")" = "$COMPARISON_SHA"

      - name: Install pinned workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3

      - name: Validate exact candidate through protected-base trust root
        id: validation
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          python3 -I .codestra/run-trusted-production-orchestrator.py
          cd candidate
          git diff --check "$COMPARISON_SHA" "$EXPECTED_SHA"

      - name: Publish candidate-bound required verdict
        if: ${{ always() && steps.required-check.outputs.check_run_id != '' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHECK_RUN_ID: ${{ steps.required-check.outputs.check_run_id }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const passed = process.env.VALIDATION_OUTCOME === 'success';
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion: passed ? 'success' : 'failure',
              output: {
                title: passed ? 'Protected-base validation passed' : 'Protected-base validation failed',
                summary: passed
                  ? 'The exact candidate head passed the protected-main launcher and approved validator policy.'
                  : 'The exact candidate head failed the protected-main launcher or approved validator policy.'
              }
            });
            if (!passed) {
              core.setFailed('Protected-base candidate validation failed.');
            }
