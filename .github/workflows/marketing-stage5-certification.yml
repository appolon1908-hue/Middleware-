name: Marketing Stage 5 Certification

on:
  pull_request:
    paths:
      - 'contracts/marketing/**'
      - 'migrations/**'
      - 'workers/**'
      - 'app/storage.py'
      - 'app/worker.py'
      - 'scripts/certify_marketing_stage5.py'
      - '.github/workflows/marketing-stage5-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/certify_marketing_stage5.py
