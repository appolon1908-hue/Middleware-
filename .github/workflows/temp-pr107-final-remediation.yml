name: Temporary PR 107 final remediation

on:
  push:
    branches:
      - feat/provider-control-staging-auth-20260903
    paths:
      - .pr107-final-remediation-trigger

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-control-staging-auth-20260903
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Repair provider identity matrix routing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/staging_product_auth_read_matrix.py")
          source = path.read_text(encoding="utf-8")

          before = '''        is_provider = client_id in provider_scopes
                  if is_provider:
                      if status_scope not in provider_scopes[client_id]:
                          raise MatrixError(
                              f"{client_id}: read probe scope is not bound to its provider operation"
                          )
          '''
          after = '''        is_provider = client_id in provider_scopes
                  if is_provider:
                      if status_scope != "provider-control.operations.read.denied":
                          raise MatrixError(
                              f"{client_id}: generic operation read scope must remain denied"
                          )
                      status_scope = sorted(provider_scopes[client_id])[0]
          '''
          if source.count(before) != 1:
              raise SystemExit("provider scope block was not found exactly once")
          source = source.replace(before, after)

          before = '''    authorization: str | None,
              tenant_id: str,
              forwarded_authorization: str | None = None,
          '''
          after = '''    authorization: str | None,
              tenant_id: str,
              provider_control: bool = False,
              forwarded_authorization: str | None = None,
          '''
          if source.count(before) != 1:
              raise SystemExit("operation probe signature was not found exactly once")
          source = source.replace(before, after)

          before = '        url=f"{gateway_base_url}/v1/operations/{operation_id}",\n'
          after = '''        url=(
                      f"{gateway_base_url}/api/v1/control/identity-probes/{operation_id}"
                      if provider_control
                      else f"{gateway_base_url}/v1/operations/{operation_id}"
                  ),
          '''
          if source.count(before) != 1:
              raise SystemExit("operation probe URL was not found exactly once")
          source = source.replace(before, after)

          marker = "                        tenant_id=tenant_id,\n"
          replacement = (
              marker
              + "                        provider_control=matrix_client.provider_control,\n"
          )
          if source.count(marker) != 2:
              raise SystemExit("expected two provider-aware same-tenant probes")
          source = source.replace(marker, replacement)

          marker = '                        tenant_id="matrix-mismatch-" + uuid.uuid4().hex,\n'
          replacement = (
              marker
              + "                        provider_control=matrix_client.provider_control,\n"
          )
          if source.count(marker) != 1:
              raise SystemExit("tenant-mismatch probe was not found exactly once")
          source = source.replace(marker, replacement)

          before = '        "route": "/v1/operations/{command_id}",\n'
          after = '''        "routes": {
                      "standard": "/v1/operations/{command_id}",
                      "provider_control": "/api/v1/control/identity-probes/{probe_id}",
                  },
          '''
          if source.count(before) != 1:
              raise SystemExit("evidence route field was not found exactly once")
          source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")

          tests = Path("tests/test_staging_product_auth_read_matrix.py")
          source = tests.read_text(encoding="utf-8")
          marker = '''    assert "/v1/commands" not in source
          '''
          replacement = '''    assert "/v1/commands" not in source
              assert "/api/v1/control/identity-probes/{operation_id}" in source
          '''
          if source.count(marker) != 1:
              raise SystemExit("source safety test marker was not found exactly once")
          source = source.replace(marker, replacement)
          marker = '''        assert caller["command_scope"].endswith(".denied")
          '''
          replacement = '''        assert caller["command_scope"].endswith(".denied")
                  assert caller["status_scope"].endswith(".denied")
          '''
          if source.count(marker) != 1:
              raise SystemExit("provider authority test marker was not found exactly once")
          source = source.replace(marker, replacement)
          tests.write_text(source, encoding="utf-8")

          docs = Path("docs/STAGING-PRODUCT-AUTH-READ-MATRIX.md")
          source = docs.read_text(encoding="utf-8")
          before = '2. `GET /v1/operations/{command_id}` using a freshly generated random UUID.\n'
          after = (
              '2. One read-only `GET` using a freshly generated random UUID: '
              'regular callers use `/v1/operations/{command_id}`, while provider-control '
              'callers use `/api/v1/control/identity-probes/{probe_id}` so they never receive '
              'tenant-wide operation-read authority.\n'
          )
          if source.count(before) != 1:
              raise SystemExit("documentation probe description was not found exactly once")
          docs.write_text(source.replace(before, after), encoding="utf-8")
          PY
          git diff --check

      - name: Install locked test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          python -m pip check

      - name: Regenerate exact runtime contracts
        env:
          PYTHONPATH: .
        run: |
          python scripts/generate_connector_artifacts.py --check
          python scripts/generate_api_contracts.py
          git diff --check
          git diff --exit-code -- connectors/generated

      - name: Run focused regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_staging_product_auth_read_matrix.py \
            tests/test_provider_control_api.py \
            tests/test_generated_api_parity.py

      - name: Commit remediation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/staging_product_auth_read_matrix.py \
            tests/test_staging_product_auth_read_matrix.py \
            docs/STAGING-PRODUCT-AUTH-READ-MATRIX.md \
            contracts/platform/middleware-openapi.generated.json \
            contracts/platform/integration-fabric-api.v2.yaml \
            config/api-completion-matrix.yaml
          git rm .pr107-final-remediation-trigger
          git rm .github/workflows/temp-pr107-final-remediation.yml
          git commit -m "fix(auth): isolate provider identity probes and refresh contracts"
          git push origin HEAD:feat/provider-control-staging-auth-20260903
