name: Run runtime certification environment rename

on:
  push:
    branches:
      - deploy/middleware-production-certification-v2-20260903
    paths:
      - ".github/workflows/run-runtime-environment-rename.yml"

permissions:
  contents: write

concurrency:
  group: run-runtime-certification-environment-rename
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact patch trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Rename environment and validate
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "deploy/middleware-production-certification-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 .automation/patch_runtime_certification_environment_name.py
          ! grep -R -F 'environment: production-runtime-certification' .github/workflows scripts docs/production
          ! grep -R -F 'environment: production' .github/workflows/production-runtime-certification.yml
          grep -F 'environment: middleware-runtime-certification' .github/workflows/production-runtime-certification.yml
          python3 scripts/validate_production_runtime_deployment.py source
          python3 -m py_compile scripts/validate_production_runtime_deployment.py tests/test_production_runtime_deployment.py
          bash -n deploy/production/server/codestra-middleware-deploy
          bash -n deploy/production/server/codestra-middleware-backup
          bash -n deploy/production/server/install-restricted-command.sh

      - name: Create final clean commit
        run: |
          set -Eeuo pipefail
          rm -f .automation/patch_runtime_certification_environment_name.py
          rm -f .github/workflows/run-runtime-environment-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(governance): use non-reserved certification environment name"
          patch_sha="$(git rev-parse HEAD)"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha" >> "$GITHUB_STEP_SUMMARY"
          set +e
          git push origin "HEAD:$GITHUB_REF_NAME"
          push_exit=$?
          set -e
          printf 'PATCH_PUSH_EXIT=%s\n' "$push_exit"
