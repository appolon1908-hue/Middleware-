name: Temporary PR 107 manifest assertion remediation

on:
  push:
    branches:
      - feat/provider-control-staging-auth-20260903
    paths:
      - .pr107-remediation-trigger

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-control-staging-auth-20260903
          fetch-depth: 1

      - name: Update manifest inventory assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_connector_sdk_v1.py")
          source = path.read_text(encoding="utf-8")
          start_marker = "    def test_manifests_are_disabled_and_non_overlapping(self) -> None:\n"
          end_marker = "        self.assertEqual(\n            self.registry.validate_global_invariants(),\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          additions = {
              '                "beyvra-nonfinancial",\n': (
                  '                "ai-provider",\n'
                  '                "beyvra-nonfinancial",\n'
              ),
              '                "odoo-19",\n': (
                  '                "marketing-provider",\n'
                  '                "odoo-19",\n'
              ),
          }
          for marker, replacement in additions.items():
              if replacement.splitlines()[0].strip() in block:
                  continue
              if block.count(marker) != 1:
                  raise SystemExit(f"manifest marker not found exactly once: {marker!r}")
              block = block.replace(marker, replacement, 1)
          path.write_text(source[:start] + block + source[end:], encoding="utf-8")
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install and test
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          python -m unittest -v tests.test_connector_sdk_v1.ConnectorSdkStandardsTests.test_manifests_are_disabled_and_non_overlapping

      - name: Commit remediation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_connector_sdk_v1.py
          git rm .pr107-remediation-trigger
          git rm .github/workflows/temp-pr107-remediation.yml
          git commit -m "test(connectors): include disabled provider manifests"
          git push origin HEAD:feat/provider-control-staging-auth-20260903
