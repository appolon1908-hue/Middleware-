name: One-shot build durable webhook-body reconciliation

on:
  push:
    branches:
      - remediation/middleware-body-cleanup-builder-20260903
    paths:
      - .github/workflows/one-shot-build-webhook-body-reconciliation.yml
      - scripts/one_shot_build_webhook_body_reconciliation.py

permissions:
  contents: write

concurrency:
  group: middleware-webhook-body-reconciliation-20260903
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact builder trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Build, test, and publish current-main remediation
        run: python scripts/one_shot_build_webhook_body_reconciliation.py
