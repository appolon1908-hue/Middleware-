name: W0 source repair bootstrap

on:
  push:
    branches:
      - fix/w0-security-readback-20260909

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply fail-closed W0 repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          script_path = Path("scripts/apply_repository_governance.py")
          tests_path = Path("tests/test_repository_governance_apply.py")
          validator_path = Path(".codestra/validate-production-orchestrator-contract.py")

          script = script_path.read_text(encoding="utf-8")
          old_function = '''def verify_automated_security_fixes(api: GitHubApi) -> None:
              """Require GitHub's documented no-content success for this feature."""

              api.request(
                  "GET",
                  "/automated-security-fixes",
                  expected=(204,),
              )
          '''
          new_function = '''def verify_automated_security_fixes(api: GitHubApi) -> None:
              """Require a typed enabled-state readback for automated security fixes."""

              response = api.request(
                  "GET",
                  "/automated-security-fixes",
                  expected=(200,),
              )
              payload = _require_mapping(
                  response.payload,
                  "automated security fixes state is invalid",
              )
              require(
                  payload.get("enabled") is True,
                  "automated security fixes are disabled",
              )
          '''
          if script.count(old_function) != 1:
              raise SystemExit("expected exactly one legacy automated-security-fixes verifier")
          script = script.replace(old_function, new_function, 1)
          script_path.write_text(script, encoding="utf-8")

          tests = tests_path.read_text(encoding="utf-8")
          old_test = '''def test_dependabot_security_update_verifier_accepts_no_content_success() -> None:
              api = Mock(spec=GitHubApi)
              api.request.return_value = ApiResponse(status=204, payload=None)

              verify_automated_security_fixes(api)

              api.request.assert_called_once_with(
                  "GET",
                  "/automated-security-fixes",
                  expected=(204,),
              )
          '''
          new_tests = '''def test_dependabot_security_update_verifier_accepts_enabled_state() -> None:
              api = Mock(spec=GitHubApi)
              api.request.return_value = ApiResponse(status=200, payload={"enabled": True})

              verify_automated_security_fixes(api)

              api.request.assert_called_once_with(
                  "GET",
                  "/automated-security-fixes",
                  expected=(200,),
              )


          @pytest.mark.parametrize("payload", [{"enabled": False}, {}])
          def test_dependabot_security_update_verifier_rejects_disabled_state(payload: dict) -> None:
              api = Mock(spec=GitHubApi)
              api.request.return_value = ApiResponse(status=200, payload=payload)

              with pytest.raises(GovernanceApplyError, match="automated security fixes are disabled"):
                  verify_automated_security_fixes(api)


          def test_dependabot_security_update_verifier_rejects_non_object_state() -> None:
              api = Mock(spec=GitHubApi)
              api.request.return_value = ApiResponse(status=200, payload=[])

              with pytest.raises(GovernanceApplyError, match="state is invalid"):
                  verify_automated_security_fixes(api)


          def test_dependabot_security_update_verifier_rejects_no_content_readback() -> None:
              api = Mock(spec=GitHubApi)
              api.request.side_effect = GovernanceApplyError(
                  "GitHub API GET /automated-security-fixes returned 204; expected [200]"
              )

              with pytest.raises(GovernanceApplyError, match="returned 204"):
                  verify_automated_security_fixes(api)

              api.request.assert_called_once_with(
                  "GET",
                  "/automated-security-fixes",
                  expected=(200,),
              )
          '''
          if tests.count(old_test) != 1:
              raise SystemExit("expected exactly one legacy automated-security-fixes test")
          tests = tests.replace(old_test, new_tests, 1)
          tests_path.write_text(tests, encoding="utf-8")

          script_hash = hashlib.sha256(script_path.read_bytes()).hexdigest()
          validator = validator_path.read_text(encoding="utf-8")
          old_hash = "1c14c21ae027f293f39b4d3965c39375a53b6dcda71bd977e6f24fab14a5d265"
          if validator.count(old_hash) != 1:
              raise SystemExit("expected exactly one locked governance-applier hash")
          validator = validator.replace(old_hash, script_hash, 1)
          validator_path.write_text(validator, encoding="utf-8")
          print(f"W0_APPLIER_SHA256={script_hash}")
          PY

          python3 -m py_compile scripts/apply_repository_governance.py tests/test_repository_governance_apply.py
          git diff --check

      - name: Commit repaired source and remove bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply_repository_governance.py tests/test_repository_governance_apply.py .codestra/validate-production-orchestrator-contract.py
          git rm -- .github/workflows/w0-source-repair-bootstrap.yml
          git diff --cached --check
          git commit -m "fix(governance): require typed enabled security-fixes readback"
          git push origin "HEAD:${GITHUB_REF_NAME}"
