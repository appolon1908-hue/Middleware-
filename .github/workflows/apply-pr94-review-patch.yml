name: Apply PR94 review patch

on:
  push:
    branches:
      - chatgpt/provider-control-runtime-v3-20260902

permissions:
  contents: write

concurrency:
  group: apply-pr94-review-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/provider-control-runtime-v3-20260902
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply reviewed patch and remove temporary files
        run: |
          set -Eeuo pipefail
          echo "5230df968b95a5dd470bc50c1622cd11244ab4c31b89db775597a1cdfdec01ce  .remediation/pr94-review-fixes.patch" | sha256sum -c -
          git apply --index .remediation/pr94-review-fixes.patch
          rm -rf .remediation
          rm -f .github/workflows/apply-pr94-review-fixes.yml
          rm -f .github/workflows/apply-pr94-review-fixes-v2.yml
          rm -f .github/workflows/apply-pr94-review-patch.yml
          git add -A
          git diff --cached --check

      - name: Install exact locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m venv .venv-review
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --upgrade pip
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --require-hashes -r requirements-test.txt

      - name: Run focused review regressions
        run: |
          set -Eeuo pipefail
          .venv-review/bin/python -m pytest -q \
            tests/test_provider_control_api.py \
            tests/test_operations.py \
            tests/test_temporal_transport.py

      - name: Run complete locked source certification
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          git diff --check
          git diff --cached --check

      - name: Commit and push review fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "ChatGPT repository remediation"
          git config user.email "noreply@openai.com"
          git commit -m "fix: normalize secret aliases and clear retry errors"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/chatgpt/provider-control-runtime-v3-20260902"
