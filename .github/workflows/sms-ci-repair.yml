name: Repair SMS final CI gates

on:
  push:
    branches:
      - feat/communications-api-v1-sms-runtime

permissions:
  contents: write

concurrency:
  group: sms-final-ci-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out SMS branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/communications-api-v1-sms-runtime
          fetch-depth: 0
          persist-credentials: true

      - name: Remove one-use diagnostic and restore command-scope cancellation tests
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sms-main-merge-diagnostic.yml
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_communications_email.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'headers=_headers(scope="klyrow.middleware.status.read", key="cancel-key-2"),':
                  'headers=_headers(key="cancel-key-2"),',
              'headers=_headers(scope="klyrow.middleware.status.read", key="cancel-key-3"),':
                  'headers=_headers(key="cancel-key-3"),',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one cancellation test marker: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          python -m compileall -q tests

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sms): clear governance and command-scope CI blockers"
          git push origin HEAD:feat/communications-api-v1-sms-runtime
