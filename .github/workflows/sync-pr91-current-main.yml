name: Synchronize PR91 with current protected main

on:
  push:
    branches:
      - chatgpt/provider-control-runtime-v1-20260902

permissions:
  contents: write

concurrency:
  group: sync-pr91-current-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/provider-control-runtime-v1-20260902
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Merge current protected main
        run: |
          set -Eeuo pipefail
          git config user.name "ChatGPT repository remediation"
          git config user.email "noreply@openai.com"
          git fetch --no-tags origin main
          git merge --no-ff --no-commit origin/main

      - name: Reconcile merged safety and caller-provenance contracts
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path("config/runtime.env.example")]
          roots.extend(sorted(Path("config").glob("**/*.env.example")))
          for path in dict.fromkeys(roots):
              if not path.is_file():
                  continue
              lines = path.read_text(encoding="utf-8").splitlines()
              seen: dict[str, str] = {}
              output: list[str] = []
              changed = False
              for line in lines:
                  stripped = line.strip()
                  if not stripped or stripped.startswith("#") or "=" not in line:
                      output.append(line)
                      continue
                  key, value = line.split("=", 1)
                  key = key.strip()
                  if key in seen:
                      if seen[key] != value:
                          raise SystemExit(
                              f"conflicting duplicate environment key {key} in {path}"
                          )
                      changed = True
                      continue
                  seen[key] = value
                  output.append(line)
              if changed:
                  path.write_text("\n".join(output) + "\n", encoding="utf-8")

          provider_path = Path("app/provider_control_api.py")
          provider = provider_path.read_text(encoding="utf-8")
          old_subject = '''    subject = claims.get("sub")
    if not isinstance(subject, str) or not subject.strip():
        raise AuthorizationError("machine token subject is required")

    command = CommandEnvelope(
'''
          new_subject = '''    subject = claims.get("sub")
    if not isinstance(subject, str) or not subject.strip():
        raise AuthorizationError("machine token subject is required")
    authenticated_client_id = claims.get("azp")
    if (
        not isinstance(authenticated_client_id, str)
        or authenticated_client_id != spec.caller_client_id
    ):
        raise AuthorizationError("verified machine client identity is required")

    command = CommandEnvelope(
'''
          if old_subject not in provider:
              raise SystemExit("provider-control subject block drifted")
          provider = provider.replace(old_subject, new_subject, 1)
          old_submit = '''    operation = await active.commands.submit(
        command,
        authenticated_subject=subject,
    )
'''
          new_submit = '''    operation = await active.commands.submit(
        command,
        authenticated_subject=subject,
        authenticated_client_id=authenticated_client_id,
    )
'''
          if old_submit not in provider:
              raise SystemExit("provider-control submission block drifted")
          provider_path.write_text(
              provider.replace(old_submit, new_submit, 1),
              encoding="utf-8",
          )

          operations_path = Path("tests/test_operations.py")
          operations = operations_path.read_text(encoding="utf-8")
          old_direct_submit = "    asyncio.run(store.submit(command))\n"
          new_direct_submit = '''    asyncio.run(
        store.submit(
            command,
            authenticated_client_id="n8n-automation",
        )
    )
'''
          if old_direct_submit not in operations:
              raise SystemExit("retry test submission block drifted")
          operations_path.write_text(
              operations.replace(old_direct_submit, new_direct_submit, 1),
              encoding="utf-8",
          )

          provider_test_path = Path("tests/test_provider_control_api.py")
          provider_test = provider_test_path.read_text(encoding="utf-8")
          old_assertion = "            assert stored.requested_by == spec.caller_client_id\n"
          new_assertion = old_assertion + (
              "            assert stored.authenticated_client_id == spec.caller_client_id\n"
          )
          if old_assertion not in provider_test:
              raise SystemExit("provider-control provenance assertion block drifted")
          provider_test_path.write_text(
              provider_test.replace(old_assertion, new_assertion, 1),
              encoding="utf-8",
          )
          PY
          git add config app/provider_control_api.py tests/test_operations.py \
                  tests/test_provider_control_api.py
          rm -f .github/workflows/sync-pr91-current-main.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check

      - name: Install exact locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m venv .venv-sync
          .venv-sync/bin/python -m pip install --disable-pip-version-check --no-input --quiet --upgrade pip
          .venv-sync/bin/python -m pip install --disable-pip-version-check --no-input --quiet --require-hashes -r requirements-test.txt

      - name: Regenerate exact source contracts
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. .venv-sync/bin/python scripts/generate_api_contracts.py
          git add contracts/platform/integration-fabric-api.v2.yaml \
                  contracts/platform/middleware-openapi.generated.json \
                  config/api-completion-matrix.yaml
          git diff --cached --check

      - name: Validate staging contract and focused regressions
        run: |
          set -Eeuo pipefail
          .venv-sync/bin/python scripts/validate_staging_intake_observability_contract.py
          .venv-sync/bin/python -m pytest -q \
            tests/test_operations.py \
            tests/test_temporal_transport.py \
            tests/test_provider_control_api.py \
            tests/test_authority_compatibility.py \
            tests/test_runtime.py

      - name: Run complete locked source certification
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          git diff --check
          git diff --cached --check

      - name: Commit synchronized source and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git commit -m "merge: synchronize provider control runtime with protected main"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/chatgpt/provider-control-runtime-v1-20260902"
