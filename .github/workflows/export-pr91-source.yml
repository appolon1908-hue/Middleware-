name: Export PR91 exact source

on:
  push:
    branches:
      - chatgpt/pr91-source-export-20260902

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Export tracked source
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          git archive --format=tar.gz --output="$RUNNER_TEMP/pr91-${GITHUB_SHA}.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/pr91-${GITHUB_SHA}.tar.gz" > "$RUNNER_TEMP/pr91-${GITHUB_SHA}.tar.gz.sha256"

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr91-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr91-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/pr91-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
