name: Publish checked migration repair tree
on:
  push:
    branches: [fix/runtime-migration-certification-20260907]
    paths: [.github/workflows/migration-repair-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'appolon1908-hue/Middleware-' && github.actor == 'appolon1908-hue' && github.ref == 'refs/heads/fix/runtime-migration-certification-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify patch and exact final tree before publishing branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path('migration-repair.patch.b64').read_text().split())
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '8e9be09b6c57d86ab78cd5c8e797b838d194354721848abe118ce20bec26528d'
          Path('/tmp/migration-repair.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/migration-repair.patch
          git apply --index /tmp/migration-repair.patch
          git rm migration-repair.patch.b64 .github/workflows/migration-repair-publish.yml
          git diff --cached --check
          test "$(git write-tree)" = '52a8850073573662f30946015e3de44bca033a8c'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: apply and verify canonical runtime migrations with locked history'
          git push origin HEAD:refs/heads/fix/runtime-migration-certification-20260907
          printf 'REPAIR_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'REPAIR_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          echo 'PRODUCTION_CHANGED=false'
