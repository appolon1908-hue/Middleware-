# Grype ignore rules for the CI container-security scan (middleware-ci.yml,
# release.yml). Every entry must name exactly one package@version, cite the
# security/ record that applies the correction at image build, and disappear
# together with that correction; tests/test_container_vulnerability_dispositions.py
# enforces the pairing. Nothing here lowers a severity or hides an unfixed finding.
ignore:
  - vulnerability: CVE-2026-82049
    package:
      name: python
      version: 3.13.15
    reason: >-
      Fixed at build time: security/python313/apply_cve_2026_82049.py installs the
      upstream 3.13-branch correction (python/cpython b8f23e3) over the pinned
      CPython 3.13.15 stdlib, digest-verified before and after. The runtime code
      never imports tarfile. Expires with the base image: the applier refuses any
      stdlib other than 3.13.15, so moving the base removes both entries.
