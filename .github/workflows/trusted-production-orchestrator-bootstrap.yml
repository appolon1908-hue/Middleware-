name: Trusted production orchestrator bootstrap

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: trusted-production-orchestrator-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
  COMPARISON_SHA: ${{ github.event.pull_request.base.sha }}
  GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
  STATUS_CONTEXT: orchestrator-contract
  VALIDATION_ROOT: ${{ github.workspace }}/candidate

jobs:
  publish-pending-status:
    if: ${{ github.event.pull_request.number == 215 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/trusted-validator-bootstrap-20260909' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish pending status on the exact candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY' > pending-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"Trusted bootstrap run {os.environ['GITHUB_RUN_ID']} started",
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            --data @pending-status.json > pending-status-response.json

  validate:
    if: ${{ github.event.pull_request.number == 215 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/trusted-validator-bootstrap-20260909' }}
    name: trusted-orchestrator-bootstrap-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out protected-base trust root
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact candidate source as inert data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ env.EXPECTED_SHA }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Import exact comparison commit from the protected checkout
        run: |
          set -Eeuo pipefail
          git -C candidate fetch \
            --no-tags \
            --no-write-fetch-head \
            "$GITHUB_WORKSPACE" \
            "$COMPARISON_SHA"
          test "$(git -C candidate rev-parse "$COMPARISON_SHA^{commit}")" = "$COMPARISON_SHA"
      - name: Install pinned workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Validate approved candidate contract from protected source
        run: python3 -I .codestra/run-trusted-production-orchestrator.py
      - name: Reject malformed candidate diffs
        run: |
          set -Eeuo pipefail
          cd candidate
          git cat-file -e "$COMPARISON_SHA^{commit}"
          git diff --check "$COMPARISON_SHA" "$EXPECTED_SHA"

  publish-final-status:
    if: ${{ always() && github.event.pull_request.number == 215 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/trusted-validator-bootstrap-20260909' }}
    needs:
      - publish-pending-status
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish trusted result on the exact candidate SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING_RESULT: ${{ needs.publish-pending-status.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -Eeuo pipefail
          if [[ "$PENDING_RESULT" == success && "$VALIDATION_RESULT" == success ]]; then
            state=success
            description="Trusted bootstrap run ${GITHUB_RUN_ID} passed"
          else
            state=failure
            description="Trusted bootstrap run ${GITHUB_RUN_ID} failed"
          fi
          python3 - "$state" "$description" <<'PY' > final-status.json
          import json, os, sys
          print(json.dumps({
              "state": sys.argv[1],
              "context": os.environ["STATUS_CONTEXT"],
              "description": sys.argv[2],
              "target_url": os.environ["RUN_URL"],
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" \
            --data @final-status.json > final-status-response.json
