name: Patch production transfer options

on:
  push:
    branches:
      - deploy/middleware-production-certification-v2-20260903
    paths:
      - ".github/workflows/patch-production-transfer-options.yml"

permissions:
  contents: write

concurrency:
  group: patch-production-transfer-options
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact patch trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Patch, validate, and publish commit identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "deploy/middleware-production-certification-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/production-runtime-certification.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = '''          ssh_options=(
            -i "$SSH_KEY_FILE"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
'''
          new = old + '''          scp_options=(
            -i "$SSH_KEY_FILE"
            -P "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=15
          )
'''
          if workflow.count(old) != 1:
              raise SystemExit('SSH option block cardinality mismatch')
          workflow = workflow.replace(old, new, 1)
          replacements = {
              'scp "${ssh_options[@]}" "$BUNDLE_ARCHIVE" "$remote:$remote_bundle"':
                  'scp "${scp_options[@]}" "$BUNDLE_ARCHIVE" "$remote:$remote_bundle"',
              'scp "${ssh_options[@]}" "$remote:$evidence_remote" "$evidence_local"':
                  'scp "${scp_options[@]}" "$remote:$evidence_remote" "$evidence_local"',
          }
          for source, target in replacements.items():
              if workflow.count(source) != 1:
                  raise SystemExit(f'SCP call cardinality mismatch: {source}')
              workflow = workflow.replace(source, target, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          validator_path = Path('scripts/validate_production_runtime_deployment.py')
          validator = validator_path.read_text(encoding='utf-8')
          old_validator = '''        "StrictHostKeyChecking=yes",
        "UserKnownHostsFile=",
        "codestra-middleware-deploy",
    ):
        require(item in workflow, f"workflow requirement missing: {item}")
    for item in ("ssh-keyscan", "appleboy/ssh-action", "StrictHostKeyChecking=no"):
        require(item not in workflow, f"workflow contains unsafe SSH behavior: {item}")
'''
          new_validator = '''        "StrictHostKeyChecking=yes",
        "UserKnownHostsFile=",
        "ssh_options=(",
        "scp_options=(",
        '-p "$DEPLOY_PORT"',
        '-P "$DEPLOY_PORT"',
        'scp "${scp_options[@]}" "$BUNDLE_ARCHIVE"',
        'scp "${scp_options[@]}" "$remote:$evidence_remote"',
        "codestra-middleware-deploy",
    ):
        require(item in workflow, f"workflow requirement missing: {item}")
    for item in (
        "ssh-keyscan",
        "appleboy/ssh-action",
        "StrictHostKeyChecking=no",
        'scp "${ssh_options[@]}"',
    ):
        require(item not in workflow, f"workflow contains unsafe SSH behavior: {item}")
'''
          if validator.count(old_validator) != 1:
              raise SystemExit('validator SSH block cardinality mismatch')
          validator_path.write_text(validator.replace(old_validator, new_validator, 1), encoding='utf-8')
          PY

          python3 scripts/validate_production_runtime_deployment.py source
          python3 -m pytest -q tests/test_production_runtime_deployment.py
          bash -n deploy/production/server/codestra-middleware-deploy
          bash -n deploy/production/server/codestra-middleware-backup
          bash -n deploy/production/server/install-restricted-command.sh

          rm -f .github/workflows/patch-production-transfer-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deploy): use the correct secure SCP port option"
          patch_sha="$(git rev-parse HEAD)"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha"
          printf 'PATCH_COMMIT_SHA=%s\n' "$patch_sha" >> "$GITHUB_STEP_SUMMARY"

          set +e
          git push origin "HEAD:$GITHUB_REF_NAME"
          push_exit=$?
          set -e
          printf 'PATCH_PUSH_EXIT=%s\n' "$push_exit"
