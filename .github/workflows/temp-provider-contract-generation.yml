name: Temporary provider contract regeneration

on:
  push:
    branches:
      - feat/provider-control-staging-auth-20260903
    paths:
      - .contract-generation-trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-control-staging-auth-20260903
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install locked test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt
          python -m pip check

      - name: Regenerate exact runtime contracts
        run: |
          python scripts/generate_connector_artifacts.py --check
          python scripts/generate_api_contracts.py
          git diff --check
          git diff --exit-code -- connectors/generated

      - name: Commit generated contracts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/platform/middleware-openapi.generated.json \
            contracts/platform/integration-fabric-api.v2.yaml \
            config/api-completion-matrix.yaml
          git rm .contract-generation-trigger
          git rm .github/workflows/temp-provider-contract-generation.yml
          git commit -m "chore(contracts): regenerate provider-control runtime API"
          git push origin HEAD:feat/provider-control-staging-auth-20260903
