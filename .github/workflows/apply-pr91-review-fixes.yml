name: Apply PR91 review remediations

on:
  push:
    branches:
      - chatgpt/provider-control-runtime-v1-20260902

permissions:
  contents: write

concurrency:
  group: pr91-review-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/provider-control-runtime-v1-20260902
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify and apply reviewed source patch
        run: |
          set -Eeuo pipefail
          base64 --decode .remediation/pr91-review-fixes.b64 > "$RUNNER_TEMP/pr91-review-fixes.patch.gz"
          gzip -dc "$RUNNER_TEMP/pr91-review-fixes.patch.gz" > "$RUNNER_TEMP/pr91-review-fixes.patch"
          echo "dfec8256609c7940c3848449a91f1f6b686666079dd7ea9f8310b1b0be64db89  $RUNNER_TEMP/pr91-review-fixes.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/pr91-review-fixes.patch"
          rm -rf .remediation
          rm -f .github/workflows/apply-pr91-review-fixes.yml
          git add -A
          git diff --cached --check

      - name: Install locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m venv .venv-review
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --upgrade pip
          .venv-review/bin/python -m pip install --disable-pip-version-check --no-input --quiet --require-hashes -r requirements-test.txt

      - name: Regenerate and verify exact contracts
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. .venv-review/bin/python scripts/generate_api_contracts.py
          git add contracts/platform/integration-fabric-api.v2.yaml \
                  contracts/platform/middleware-openapi.generated.json \
                  config/api-completion-matrix.yaml
          git diff --cached --check

      - name: Run focused review regressions
        run: |
          set -Eeuo pipefail
          .venv-review/bin/python -m pytest -q \
            tests/test_operations.py \
            tests/test_temporal_transport.py \
            tests/test_provider_control_api.py \
            tests/test_authority_compatibility.py

      - name: Run complete locked source certification
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          git diff --check
          git diff --cached --check

      - name: Commit and push exact-head remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name "ChatGPT repository remediation"
          git config user.email "noreply@openai.com"
          git commit -m "fix: align safe retry state and provider response contracts"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/chatgpt/provider-control-runtime-v1-20260902"
