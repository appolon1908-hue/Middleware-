name: Generate automation v2 repair artifact

on:
  push:
    branches:
      - feat/automation-v2-runtime-integration-20260904

permissions:
  contents: read

concurrency:
  group: automation-v2-repair-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  generate-and-verify:
    if: github.repository == 'appolon1908-hue/Middleware-' && github.ref == 'refs/heads/feat/automation-v2-runtime-integration-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685 # 16-alpine
        env:
          POSTGRES_USER: middleware
          POSTGRES_PASSWORD: middleware_ci_only
          POSTGRES_DB: middleware_test_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U middleware -d middleware_test_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf # 7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact clean source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install hash-locked test dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --require-hashes -r requirements-test.txt
          python3 -m pip check

      - name: Apply deterministic test and governance repairs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one repair target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Preserve runtime readiness, including the explicit not_configured state.
          replace_once(
              "tests/test_runtime.py",
              '            "incident_store": "not_configured",\n        }\n',
              '            "incident_store": "not_configured",\n'
              '            "automation_store": "not_configured",\n        }\n',
          )
          replace_once(
              "tests/test_automation_v2.py",
              '    observed = {\n'
              '        f"{method} {route.path}"\n'
              '        for route in app.routes\n'
              '        for method in (route.methods or set())\n'
              '        if route.path.startswith("/v2/automation")\n'
              '    }\n',
              '    schema = app.openapi()\n'
              '    observed = {\n'
              '        f"{method.upper()} {path}"\n'
              '        for path, item in schema["paths"].items()\n'
              '        if path.startswith("/v2/automation")\n'
              '        for method in item\n'
              '        if method in {"get", "post", "put", "patch", "delete", "head", "options", "trace"}\n'
              '    }\n',
          )
          register_path = Path("config/test-skip-register.v1.json")
          register = json.loads(register_path.read_text(encoding="utf-8"))
          entry = {
              "path": "tests/integration/test_automation_v2_store.py",
              "gate": "RUNTIME_INTEGRATION_TESTS",
              "required_job": "Disposable PostgreSQL Redis integration",
          }
          rows = register["registered_files"]
          if any(row.get("path") == entry["path"] for row in rows):
              raise SystemExit("automation v2 store test is already registered")
          rows.append(entry)
          register_path.write_text(json.dumps(register, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Regenerate runtime-derived API authorities
        run: |
          set -Eeuo pipefail
          python3 scripts/generate_api_contracts.py
          python3 -m json.tool contracts/platform/middleware-openapi.generated.json >/dev/null
          python3 -m json.tool config/test-skip-register.v1.json >/dev/null

      - name: Run repository and focused regression gates
        env:
          PYTEST_ADDOPTS: -p no:cacheprovider
        run: |
          set -Eeuo pipefail
          bash scripts/run_ci.sh
          pytest -q tests/test_automation_v2.py tests/test_generated_api_parity.py tests/test_runtime.py
          git diff --check
          git diff --exit-code -- app/runtime.py

      - name: Run complete hermetic test suite
        env:
          PYTEST_ADDOPTS: -p no:cacheprovider
        run: pytest -q

      - name: Prove real disposable PostgreSQL and Redis coverage
        env:
          RUNTIME_INTEGRATION_TESTS: "1"
          RUNTIME_INTEGRATION_ALLOW_DISPOSABLE: "YES"
          DATABASE_URL: postgresql://middleware:middleware_ci_only@127.0.0.1:5432/middleware_test_runtime
          REDIS_URL: redis://127.0.0.1:6379/15
        run: bash scripts/integration_ci.sh

      - name: Record verified repair manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              "tests/test_runtime.py",
              "config/test-skip-register.v1.json",
              "tests/test_automation_v2.py",
              "contracts/platform/middleware-openapi.generated.json",
              "contracts/platform/integration-fabric-api.v2.yaml",
              "config/api-completion-matrix.yaml",
          ]
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed or changed - set(paths):
              raise SystemExit(f"unexpected repair diff: {sorted(changed)}")
          evidence = {
              "schema_version": "1.0",
              "source_sha": os.environ["GITHUB_SHA"],
              "runtime_deployed": False,
              "external_effects_enabled": False,
              "files": {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in paths},
          }
          out = Path("artifacts/automation-v2-repair")
          out.mkdir(parents=True, exist_ok=True)
          (out / "manifest.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload verified repair files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-v2-repair-${{ github.sha }}
          path: |
            tests/test_runtime.py
            config/test-skip-register.v1.json
            tests/test_automation_v2.py
            contracts/platform/middleware-openapi.generated.json
            contracts/platform/integration-fabric-api.v2.yaml
            config/api-completion-matrix.yaml
            artifacts/automation-v2-repair/manifest.json
          if-no-files-found: error
          retention-days: 7

  publish-repair-branch:
    needs: generate-and-verify
    if: github.repository == 'appolon1908-hue/Middleware-' && github.ref == 'refs/heads/feat/automation-v2-runtime-integration-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No repository code executes in this write-capable job.
      - name: Check out the exact verified parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download this run's verified files outside the checkout
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: automation-v2-repair-${{ github.sha }}
          path: ${{ runner.temp }}/automation-v2-repair

      - name: Validate exact manifest and allowlisted replacement files
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          paths = {
              "tests/test_runtime.py",
              "config/test-skip-register.v1.json",
              "tests/test_automation_v2.py",
              "contracts/platform/middleware-openapi.generated.json",
              "contracts/platform/integration-fabric-api.v2.yaml",
              "config/api-completion-matrix.yaml",
          }
          root = Path(os.environ["RUNNER_TEMP"]) / "automation-v2-repair"
          manifest = json.loads((root / "artifacts/automation-v2-repair/manifest.json").read_text())
          if manifest["source_sha"] != os.environ["GITHUB_SHA"] or set(manifest["files"]) != paths:
              raise SystemExit("repair source or file allowlist mismatch")
          if manifest["runtime_deployed"] is not False or manifest["external_effects_enabled"] is not False:
              raise SystemExit("source-only boundary mismatch")
          for path in sorted(paths):
              source, target = root / path, Path(path)
              if source.is_symlink() or target.is_symlink() or not source.is_file() or not target.is_file():
                  raise SystemExit(f"not a regular tracked replacement: {path}")
              if hashlib.sha256(source.read_bytes()).hexdigest() != manifest["files"][path]:
                  raise SystemExit(f"repair hash mismatch: {path}")
          for path in sorted(paths):
              shutil.copyfile(root / path, path)
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if not changed or changed - paths:
              raise SystemExit("unexpected publication diff")
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "add", "--", *sorted(paths)], check=True)
          PY

      - name: Commit and fast-forward only the unchanged PR 132 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          branch=feat/automation-v2-runtime-integration-20260904
          test "$GITHUB_REF" = "refs/heads/$branch"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit --signoff -m 'fix(automation): reconcile v2 tests governance and generated contracts'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          printf 'REPAIR_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf '%s\n' 'MAIN_CHANGED=NO' 'PRODUCTION_DEPLOYED=NO' 'EXTERNAL_DELIVERY=NO'
