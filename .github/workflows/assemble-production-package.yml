name: Assemble Middleware production certification package

on:
  push:
    branches:
      - deploy/middleware-production-certification-v2-20260903
    paths:
      - ".automation/production-package/**"
      - ".github/workflows/assemble-production-package.yml"

permissions:
  contents: write

concurrency:
  group: assemble-middleware-production-certification-package
  cancel-in-progress: false

jobs:
  assemble:
    if: github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact package head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assemble, validate, and commit production package
        env:
          EXPECTED_ARCHIVE_SHA256: 48e8cb091e8c68e467fcdb4f7e8e40b3dcf0ab3502081b96db2529003dd47820
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "deploy/middleware-production-certification-v2-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(find .automation/production-package -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 13

          archive="$RUNNER_TEMP/middleware-production-certification.tar.xz"
          find .automation/production-package -maxdepth 1 -type f -name 'chunk-*' -print0 \
            | sort -z \
            | xargs -0 cat \
            | tr -d '\n\r ' \
            | base64 --decode > "$archive"

          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          ! tar -tJf "$archive" | grep -Eq '(^/|(^|/)\.\.(/|$))'
          tar -xJf "$archive" -C .

          python3 scripts/validate_production_runtime_deployment.py source
          python3 -m py_compile \
            scripts/validate_production_runtime_deployment.py \
            tests/test_production_runtime_deployment.py
          bash -n deploy/production/server/codestra-middleware-deploy
          bash -n deploy/production/server/codestra-middleware-backup
          bash -n deploy/production/server/install-restricted-command.sh

          rm -rf .automation/production-package
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: add fail-closed Middleware production certification"
          git push origin "HEAD:$GITHUB_REF_NAME"
