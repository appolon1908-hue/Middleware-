name: Export locked test wheelhouse for remediation

on:
  push:
    branches:
      - chatgpt/runtime-completion-20260902

permissions:
  contents: read

concurrency:
  group: export-wheelhouse-${{ github.sha }}
  cancel-in-progress: true

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@0ea9e3e627f9f5d97f83c7e186a55275001dc580 # v6.2.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Download exact locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip download --require-hashes --only-binary=:all: -r requirements-test.txt -d "$RUNNER_TEMP/wheelhouse"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path(os.environ["RUNNER_TEMP"]) / "wheelhouse"
          entries = []
          for path in sorted(root.iterdir()):
              if path.is_file():
                  entries.append({"name": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          (Path(os.environ["RUNNER_TEMP"]) / "wheelhouse-manifest.json").write_text(
              json.dumps(entries, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload locked wheelhouse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: middleware-test-wheelhouse-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wheelhouse
            ${{ runner.temp }}/wheelhouse-manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
