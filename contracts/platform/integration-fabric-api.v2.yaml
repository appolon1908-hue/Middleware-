openapi: 3.1.0
info:
  title: Codestra Integration Fabric API
  version: 2.0.0
  description: Contract-first platform, operation, integration, and private automation API.
servers:
  - url: https://api.codestra.co
    description: Public gateway; runtime activation is outside this contract.
paths:
  /v1/platform/tenants:
    post:
      operationId: createTenant
      security: [{oauth2: [platform.tenant.create]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}:
    get:
      operationId: getTenant
      security: [{oauth2: [platform.tenant.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: Tenant projection}
    patch:
      operationId: updateTenant
      security: [{oauth2: [platform.tenant.write]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/IfMatch'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}/preflight:
    post:
      operationId: runTenantPreflight
      security: [{oauth2: [platform.preflight.execute]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/platform/tenants/{tenant_id}/readiness:
    get:
      operationId: getTenantReadiness
      security: [{oauth2: [platform.readiness.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200': {description: Authoritative readiness projection}
  /v1/integrations/catalog:
    get:
      operationId: listIntegrationCatalog
      security: [{oauth2: [integration.catalog.read]}]
      responses:
        '200': {description: Available integration types}
  /v1/integrations/connections:
    post:
      operationId: createIntegrationConnection
      security: [{oauth2: [integration.connection.write]}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/integrations/connections/{connection_id}/test:
    post:
      operationId: testIntegrationConnection
      security: [{oauth2: [integration.connection.test]}]
      parameters:
        - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /v1/operations/{operation_id}:
    get:
      operationId: getOperation
      security: [{oauth2: [operation.read]}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Current operation state}
  /v1/dead-letters/{dead_letter_id}/replay:
    post:
      operationId: requestDeadLetterReplay
      security: [{oauth2: [operations.replay.request]}]
      parameters:
        - {name: dead_letter_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
  /internal/v1/automation/runs/claim:
    post:
      operationId: claimAutomationRun
      security: [{oauth2: [automation.job.claim]}]
      responses:
        '200': {description: Leased automation run}
        '204': {description: No eligible run}
  /internal/v1/automation/runs/{run_id}/heartbeat:
    post:
      operationId: heartbeatAutomationRun
      security: [{oauth2: [automation.job.heartbeat]}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Lease extended}
        '409': {description: Lease lost}
  /internal/v1/automation/runs/{run_id}/result:
    post:
      operationId: reportAutomationResult
      security: [{oauth2: [automation.job.complete, automation.job.fail]}]
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Terminal result accepted idempotently}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.codestra.co/realms/codestra/protocol/openid-connect/token
          scopes:
            platform.tenant.create: Create a tenant operation
            platform.tenant.read: Read authorized tenant state
            platform.tenant.write: Change authorized tenant state
            platform.preflight.execute: Run a no-effect readiness preflight
            platform.readiness.read: Read authoritative readiness
            integration.catalog.read: Read available integration types
            integration.connection.write: Create or change connection metadata
            integration.connection.test: Request a no-effect connection test
            operation.read: Read operation state
            operations.replay.request: Request protected dead-letter replay
            automation.job.claim: Claim authorized automation work
            automation.job.heartbeat: Extend the current lease
            automation.job.complete: Report successful orchestration
            automation.job.fail: Report failed orchestration
  parameters:
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 180}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  responses:
    OperationAccepted:
      description: Durable asynchronous operation accepted
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: {type: string, format: uuid}
                  status: {type: string, enum: [accepted]}
              meta:
                type: object
                required: [correlation_id, api_version]
                properties:
                  correlation_id: {type: string, format: uuid}
                  api_version: {const: v1}
